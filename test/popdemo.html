<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R29：弹出类 Select / Menu + MenuItem</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 320px; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R29：弹出类（下拉选择 / 菜单项多选）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/popdemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');
    const group = async (name, fn) => {
      try { await fn(); } catch (e) {
        allPass = false;
        lines.push(`FAIL [${name}] 抛出异常：${e && e.stack ? String(e.stack).split('\n')[0] : e}`);
      }
    };

    try {
      __arkui_dom_requireModule('PopDemo');
      __arkui_dom_loadRoute('pages/PopDemo', root);
      await tick(80);
      check(!!el('sel1') && !!el('mn1'), 'PopDemo 页面已渲染');

      // ══════════ ① Select：options → <option>、selected 落 selectedIndex ══════════
      await group('Select', async () => {
        check(el('sel1').tagName === 'SELECT', `沿用原生 <select>（tag=${el('sel1').tagName}）`);
        check(el('sel1').options.length === 3 && el('sel1').options[2].textContent === 'C',
          `三选项建成 <option>（共 ${el('sel1').options.length} 个，第 3 项 '${el('sel1').options[2] && el('sel1').options[2].textContent}'）`);
        check(el('sel1').selectedIndex === 1 && el('sel1').value === 'B',
          `selected(1) → selectedIndex=1，显示 'B'（实际 ${el('sel1').selectedIndex}/'${el('sel1').value}'）`);
        check(el('sel1').style.color === 'rgb(0, 102, 204)', `fontColor → color（实际 '${el('sel1').style.color}'）`);
        // 编程改 selectedIndex 不派发 change（取舍已记录）；测试用 dispatchEvent 驱动
        el('sel1').selectedIndex = 2;
        el('sel1').dispatchEvent(new Event('change', { bubbles: true }));
        await tick(30);
        check(txt('pop-log') === 'SEL2/C;', `onSelect 双参 (2,'C')（log='${txt('pop-log')}'）`);
        el('sel1').selectedIndex = 0;
        el('sel1').dispatchEvent(new Event('change', { bubbles: true }));
        await tick(30);
        check(txt('pop-log') === 'SEL2/C;SEL0/A;', `再选 A → (0,'A')（log='${txt('pop-log')}'）`);
      });

      // ══════════ ② Select.value：显示文本覆盖（记录取舍）══════════
      await group('Select.value', async () => {
        check(el('sel2').selectedIndex === 0 && el('sel2').value === 'X',
          `selected(0) → 显示 'X'（实际 ${el('sel2').selectedIndex}/'${el('sel2').value}'）`);
        check(el('sel2').dataset.valueText === 'Choosed',
          `value('Choosed') 记 data-value-text（实际 '${el('sel2').dataset.valueText}'）`);
      });

      // ══════════ ③ Menu/MenuItem：内容 + 选中标记 + 点击切换 ══════════
      await group('Menu·MenuItem', async () => {
        check(!!el('mi1') && !!el('mi2') && el('mi1').textContent.includes('item1'),
          `MenuItem 内容渲染（'${el('mi1') && el('mi1').textContent}'）`);
        check(el('mi2').dataset.selected === 'true' && el('mi2').textContent.includes('✓'),
          `selected(true) → 标记（selected='${el('mi2').dataset.selected}'）`);
        check(el('mi1').dataset.selected === 'false', `selected(false)（实际 '${el('mi1').dataset.selected}'）`);
        el('mi1').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        await tick(30);
        check(txt('menu-log') === 'I1true;', `点 item1 → onChange(true)（log='${txt('menu-log')}'）`);
        el('mi2').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        await tick(30);
        check(txt('menu-log') === 'I1true;I2false;', `点 item2（原选中）→ onChange(false)（log='${txt('menu-log')}'）`);
        check(el('mi2').dataset.selected === 'false', '点击后取消选中（多选语义，每项独立）');
      });

      // ══════════ ④ 回归：没有"未实现"假警告 ══════════
      await group('回归', async () => {
        const bad = __arkui_dom_layout_warnings.filter((w) =>
          /Select\.|Menu\.|MenuItem\./.test(String(w)));
        check(bad.length === 0, `弹出类属性不再记"未实现"警告（剩 ${bad.length} 条：${bad.slice(0, 2).join('|')}）`);
      });

      lines.push(`POP sel='${txt('pop-log')}' menu='${txt('menu-log')}'`);
      lines.push(`ELMT ${__arkui_dom_elmtRecords.size}`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';
  })();
  </script>
</body>
</html>
