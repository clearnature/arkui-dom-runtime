<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R90：NotesDemo——千节点真实应用端到端（路由/大列表/搜索/剪贴板/设备信息）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 360px; }
  #root [data-arkui-comp="List"] { max-height: 280px; overflow-y: auto; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; font-size: 12px; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R90：NotesDemo——300 行列表（~1200 节点）端到端</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/noteshome-module.js"></script>
  <script src="../build/notesdetail-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let pass = 0, fail = 0;
    const check = (c, m) => { if (c) { pass++; lines.push('PASS ' + m); } else { fail++; lines.push('FAIL ' + m); } };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms || 0));
    const root = document.getElementById('root');
    const isElectron = !!(globalThis.electronAPI && globalThis.electronAPI.clip);

    // 首渲染：千节点级真实页面（带 PERF 信息行，非门禁口径）
    const t0 = performance.now();
    document.addEventListener('click', (e) => {
      (window.__clickLog = window.__clickLog || []).push('target=' + (e.target.id || e.target.tagName) +
        ' comp=' + (e.target.getAttribute && e.target.getAttribute('data-arkui-comp')) +
        ' sec=' + (e.target.getAttribute && e.target.getAttribute('data-security-btn')));
    }, true);
    const pbm = __arkui_dom_require('@ohos:pasteboard');
    const origBoard = pbm.getSystemPasteboard;
    pbm.getSystemPasteboard = function () {
      const b = origBoard();
      const og = b.getData.bind(b);
      b.getData = function () {
        (window.__gdStacks = window.__gdStacks || []).push(String(new Error().stack).split('\n').slice(1, 4).join(' | '));
        return og();
      };
      return b;
    };
    __arkui_dom_requireModule('NotesHome');
    __arkui_dom_requireModule('NotesDetail');   // 模块体执行 → registerNamedRoute 入册（router 先例）
    __arkui_dom_loadRoute('pages/NotesHome', root);
    const syncMs = performance.now() - t0;
    await tick(80);
    const nodes = root.querySelectorAll('[data-arkui-comp]').length;
    const countEl = root.querySelector('#note-count');
    lines.push('PERF7 first_sync_ms=' + syncMs.toFixed(1) + ' nodes=' + nodes + ' rows=' + (countEl ? countEl.textContent : ''));

    // ① 千节点渲染
    check(syncMs < 400, 'notes 首渲染同步段 300 行 < 400ms（实测 ' + syncMs.toFixed(1) + 'ms）');
    check(nodes >= 1000, 'notes 千节点级：DOM 组件节点 ' + nodes + ' ≥ 1000');
    check(countEl && countEl.textContent === 'count=300', 'notes 列表 count=300');

    // ② 设备信息进页面（R89 deviceInfo 集成）
    const title = root.querySelector('#home-title');
    check(title && title.textContent.indexOf('Notes ') === 0 && title.textContent.length > 8,
      'notes deviceLine 已渲染：' + (title ? title.textContent.slice(0, 32) : ''));

    // ③ 剪贴板集成（R89 pasteboard；Electron 真剪贴板）
    root.querySelector('#btn-copy').click();
    let copied = false;
    for (let i = 0; i < 100; i++) {
      await tick(10);
      const cl = root.querySelector('#copy-log');
      if (cl && cl.textContent === 'copyLog=copied') { copied = true; break; }
    }
    check(copied, 'notes pasteboard 写入完成（copyLog=copied）');
    if (isElectron) {
      const clip = await globalThis.electronAPI.clip.readText();
      check(clip === 'Body of Note 0 for copy test', 'notes 真剪贴板内容=Note 0 正文');
    } else {
      check(true, '（浏览器端内存兜底，真剪贴板不验证）');
    }

    // ④ 搜索过滤（TextInput onChange → @State 重渲染）
    const box = root.querySelector('#search-box');
    const input = box.querySelector('input') || box;
    input.value = 'Note 299';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    await tick(60);
    check(countEl && countEl.textContent === 'count=1', 'notes 搜索 Note 299 → count=1');
    input.value = '';
    input.dispatchEvent(new Event('input', { bubbles: true }));
    await tick(60);
    check(countEl && countEl.textContent === 'count=300', 'notes 清空搜索 → count=300');

    // ⑤ 路由到详情（router.pushUrl + params）
    const firstRow = root.querySelector('[data-arkui-comp="Row"]');
    lines.push('SAMPLE pre-click gd=' + (window.__gdStacks || []).length + ' v=' + (root.querySelector('#note-count') || {}).textContent);
    firstRow.click();
    await tick(20);
    lines.push('SAMPLE post-click20 gd=' + (window.__gdStacks || []).length + ' v=' + (root.querySelector('#note-count') || {}).textContent);
    await tick(80);
    const detailIdx = root.querySelector('#detail-idx');
    const detailTitle = root.querySelector('#detail-title');
    check(!!detailIdx && detailIdx.textContent === 'detail idx=0', 'notes 路由详情页：idx=0（params 传递）');
    check(!!detailTitle && detailTitle.textContent === 'title=Note 0', 'notes 详情标题=Note 0');

    // ⑥ 返回首页（router.back），列表状态保持
    root.querySelector('#btn-back').click();
    await tick(20);
    lines.push('SAMPLE post-back20 gd=' + (window.__gdStacks || []).length + ' v=' + (root.querySelector('#note-count') || {}).textContent);
    await tick(80);
    const countBack = root.querySelector('#note-count');
    check(!!countBack && countBack.textContent === 'count=300',
      'notes 返回首页：300 行状态保持（实测 ' + (countBack ? countBack.textContent : '无') + '）');

    lines.push('SAMPLE back-count-elms=' + document.querySelectorAll('#note-count').length);
    lines.push('SAMPLE back-paste-btns=' + document.querySelectorAll('#btn-paste').length);
    ((/** @type {any} */ (window)).__gdStacks || []).forEach((st, i) => lines.push('GD' + i + ' ' + st.slice(0, 170)));
    (window.__clickLog || []).forEach((c, i) => lines.push('CLK' + i + ' ' + c));
    ((/** @type {any} */ (window)).__secClicks || []).forEach((c, i) => lines.push('SEC' + i + ' ' + c.slice(0, 260)));
    lines.push('SAMPLE back-roots=' + document.querySelectorAll('#root').length);
    lines.push('SAMPLE back-body-children=' + document.body.children.length);
    // ═══ R92：保存到文件 + PasteButton 从剪贴板新建 ═══
    const fsMod = __arkui_dom_require('@ohos:file.fs');
    // ⑦ save 流：picker.save（测试驱动返回 vfs 内 uri）+ fs fd 写
    root.querySelector('#btn-save').click();
    let saved = false;
    for (let i = 0; i < 100; i++) {
      await tick(10);
      const sl = root.querySelector('#save-log');
      if (sl && sl.textContent.indexOf('saveLog=file://') === 0) { saved = true; break; }
    }
    const slEl = root.querySelector('#save-log');
    if (isElectron) {
      check(saved, 'notes save 流：picker.save 返回 file:// uri（实测 saveLog=' +
        JSON.stringify(slEl ? slEl.textContent : '无元素') + '）');
    } else {
      check(slEl && slEl.textContent === 'saveLog=null',
        'notes save 流浏览器降级：picker 无桥 → null（探测式降级先例）');
    }
    const st = fsMod.statSync('/vfs/note-0.txt');
    check(st && st.size > 0, 'notes fs fd 写落盘：note-0.txt size=' + (st && st.size));
    // ⑧ PasteButton：剪贴板 → 新建笔记（相对断言——先读当前剪贴板再比）
    const pbMod = __arkui_dom_require('@ohos:pasteboard');
    const before = await pbMod.getSystemPasteboard().getData();
    const clipText = before.getPrimaryText();
    root.querySelector('#btn-paste').click();
    await tick(80);
    const countAfter = root.querySelector('#note-count');
    lines.push('PASTE-DEBUG after80=' + (countAfter ? countAfter.textContent : '无'));
    await tick(200);
    const countAfter2 = root.querySelector('#note-count');
    lines.push('PASTE-DEBUG after280=' + (countAfter2 ? countAfter2.textContent : '无'));
    check(countAfter2 && countAfter2.textContent === 'count=301',
      'notes PasteButton → count=301（' + (countAfter ? countAfter.textContent : '') + '）');
    const pastedRow = root.textContent.indexOf('Pasted 300') >= 0;
    check(pastedRow, 'notes 新行 Pasted 300 在列');
    check(clipText.length > 0 && pastedRow,
      'notes 粘贴流完整：剪贴板非空（' + JSON.stringify(clipText.slice(0, 16)) + '）且 Pasted 行在列');

    if (fail === 0) lines.unshift(`=== ALL PASS (${pass}) ===`);
    else lines.unshift(`=== ${fail} FAILURES / ${pass} PASS ===`);
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = fail === 0 ? 'pass' : 'fail';
    document.title = fail === 0 ? 'PASS' : 'FAIL';
  })();
  </script>
</body>
</html>
