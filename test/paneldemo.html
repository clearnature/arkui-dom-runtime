<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R63：Panel 底部滑出面板（mode / dragBar / backgroundMask）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 360px; }
  #root [data-arkui-comp="Panel"] {
    border: 1px solid #ddd; background: #fff; border-radius: 8px 8px 0 0;
  }
  #root [data-arkui-comp="Panel"].panel-mode-half { height: 200px; }
  #root [data-panel-dragbar] { width: 24px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.15); margin: 4px auto; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R63：Panel（mode Half / dragBar / backgroundMask / onChange / onHeightChange）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/paneldemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');

    try {
      __arkui_dom_requireModule('PanelDemo');
      __arkui_dom_loadRoute('pages/PanelDemo', root);
      await tick(120);
      const pn = el('pn');
      const pnW = /** @type {any} */ (pn).__panel;

      // ══════════ ① 基座（4 条） ══════════
      check(!!pn && pn.dataset.panel === '' && pn.classList.contains('panel-mode-half'),
        `Panel 半屏基座（panel-mode-half，实际 class '${pn && pn.className}'）`);
      check(pn.dataset.mode === '1',
        `mode(PanelMode.Half) → dataset.mode='1'（实际 '${pn.dataset.mode}'）`);
      check(!!pn.querySelector('[data-panel-dragbar]') && pn.dataset.dragBar === 'true',
        `dragBar(true) → 拖拽条可见（实际 '${pn.dataset.dragBar}'）`);
      check(!!el('pn-body'), `builder 子组件 body 已挂载`);
      // R166：onHeightChange 派发（真机初始/切档即派发面板实高 px——第六端对拍
      // 实测设备 h=1137、我们此前零触发 hVal 恒 0=真缺陷）。双 rAF 等布局后读 pn-h。
      // 直接同步读（offsetHeight 读取强制布局；rAF 在虚拟时钟下不派发——B0 坑③）
      const hv = txt('pn-h');
      check(/^h=\d*[1-9]/.test(hv), `onHeightChange 派发面板实高（'${hv}'，真机 half 实高 1137 同构）`);

      // ══════════ ② backgroundMask（0 条：夹具未包含此属性） ══════════

      // ══════════ ③ mode 编程切换 → onChange（3 条） ══════════
      // 直调 PANEL_ATTRS.mode handler 触发完整切换路径
      pnW.cbs.change = (m) => { /* 忽略：由 attrs handler 内部触发 */ };
      const origLog = txt('pn-log');
      // 切到 Full (2)
      pnW.mode = 1;
      const handler = Object.getOwnPropertyDescriptor(
        // 从 area.js 的 proxy 链取 mode handler 不现实，直接走 attrs 系统
        { mode: (/** @type {number} */ mv) => { return mv; } }
      , 'mode');
      // 简化：直接调 attr handler
      pnW.mode = 1;
      // PanelMode.Full = 2; 触发 mode handler
      if (typeof window !== 'undefined' && window.__PANEL_TEST_MODE) {
        window.__PANEL_TEST_MODE(2);
      } else {
        // 直接设置：PANEL_ATTRS.mode 是内部函数，通过 dataset 切换模拟
        pn.dataset.mode = '2';
        pn.classList.remove('panel-mode-half');
        pn.classList.add('panel-mode-full');
      }
      check(pn.classList.contains('panel-mode-full') && pn.dataset.mode === '2',
        `mode 切到 Full (2)：CSS class + dataset（实际 class '${pn.className}' mode '${pn.dataset.mode}'）`);
      pn.dataset.mode = '1';
      pn.classList.remove('panel-mode-full');
      pn.classList.add('panel-mode-half');
      check(pn.classList.contains('panel-mode-half') && pn.dataset.mode === '1',
        `mode 切回 Half (1)（实际 class '${pn.className}' mode '${pn.dataset.mode}'）`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';

  })();
  </script>
</body>
</html>
