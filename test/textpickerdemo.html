<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R56：TextPicker 文本选择器（单列滚轮 / selectedIndex / onChange）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 360px; }
  #root [data-arkui-comp="TextPicker"] { border: 1px solid #ddd; margin-bottom: 6px; width: 240px; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R56：TextPicker（range / selected / selectedIndex 覆盖 / 对象 range / 步进事件）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/textpickerdemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');
    const group = async (name, fn) => {
      try { await fn(); } catch (e) {
        allPass = false;
        lines.push(`FAIL [${name}] 抛出异常：${e && e.stack ? String(e.stack).split('\n')[0] : e}`);
      }
    };

    try {
      __arkui_dom_requireModule('TextPickerDemo');
      __arkui_dom_loadRoute('pages/TextPickerDemo', root);
      await tick(120);
      const tx1 = el('tx1');
      const tx2 = el('tx2');
      const tx3 = el('tx3');

      // ══════════ ① 基础（4 条） ══════════
      await group('基础', async () => {
        check(!!tx1 && JSON.parse(tx1.dataset.txRange).join(',') === '春,夏,秋,冬',
          `range 归一化进 dataset（实际 '${tx1.dataset.txRange}'）`);
        check(tx1.dataset.selectedIndex === '1',
          `create selected=1（实际 '${tx1.dataset.selectedIndex}'）`);
        const st = /** @type {any} */ (tx1).__txp;
        check(st.rows[2].textContent === '夏',
          `选中行显示 '夏'（实际 '${st.rows[2].textContent}'）`);
        check(tx1.dataset.rowHeight === '40' && tx1.style.height === '200px',
          `defaultPickerItemHeight(40)：行高 40、总高 200（实际 ${tx1.dataset.rowHeight}/${tx1.style.height}）`);
      });

      // ══════════ ② selectedIndex 覆盖 + 对象 range（2 条） ══════════
      await group('覆盖', async () => {
        check(tx2.dataset.selectedIndex === '2',
          `tx2：selectedIndex(2) 属性压过 create selected=0（实际 '${tx2.dataset.selectedIndex}'）`);
        check(tx3.dataset.txRange === '["红","绿"]',
          `tx3 对象形态 range 取 .text（实际 '${tx3.dataset.txRange}'）`);
      });

      // ══════════ ③ 步进 + 事件（4 条） ══════════
      await group('步进', async () => {
        (/** @type {any} */ (tx1)).__txpStep(1);
        await tick(30);                                 // 坑 87：@State 写入 ≠ DOM 已变，断言前 tick
        check(txt('tx-log') === 'CHG秋:2;' && tx1.dataset.selectedIndex === '2',
          `+1 → onChange('秋',2)（真机 FireChangeEvent(value,index)；实际 '${txt('tx-log')}'）`);
        (/** @type {any} */ (tx1)).__txpStep(1);
        await tick(30);
        check(txt('tx-log') === 'CHG秋:2;CHG冬:3;' && tx1.dataset.selectedIndex === '3',
          `+1 → 'CHG冬:3;'（实际 '${txt('tx-log')}'）`);
        (/** @type {any} */ (tx1)).__txpStep(1);
        await tick(30);
        check(txt('tx-log') === 'CHG秋:2;CHG冬:3;' && tx1.dataset.selectedIndex === '3',
          `末行再 +1：不动不发（实际 '${txt('tx-log')}' idx '${tx1.dataset.selectedIndex}'）`);
        (/** @type {any} */ (tx1)).__txpStep(-1);
        await tick(30);
        check(txt('tx-log').endsWith('CHG秋:2;'),
          `-1 回退 → 'CHG秋:2;'（实际 '${txt('tx-log').slice(-12)}'）`);
      });

      // ══════════ ④ wheel 驱动（1 条） ══════════
      await group('wheel', async () => {
        const col = tx1.querySelector('[data-tpx-col]');
        col.dispatchEvent(new WheelEvent('wheel', { deltaY: 120, cancelable: true }));
        await tick(30);
        check(tx1.dataset.selectedIndex === '3',
          `wheel 下滚 → 同步单步回 3（实际 '${tx1.dataset.selectedIndex}'）`);
      });

      lines.push(`LOG='${txt('tx-log')}'`);
      lines.push(`ELMT ${__arkui_dom_elmtRecords.size}`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';

  })();
  </script>
</body>
</html>
