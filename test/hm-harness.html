<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第六端对拍 harness（切片 2）</title>
<style>body{margin:8px}#root{width:420px}</style>
</head>
<body>
  <div id="root"></div>
  <div id="result">running…</div>
  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script>
  // R163（第六端切片 2）：中立渲染 harness——不做断言，只把 fixture 在我们运行时
  // 里的【可见文本流】交给 hm-pages.py 与真 ArkUI（uitest dumpLayout）对拍。
  // 查询参数：mod=build/X.js（模块文件）· reg=注册 id（cjs 包装件需要，classic 件可空）
  //           route=pages/X（registerNamedRoute 的 pagePath）
  // 结果：#result = JSON {ok, texts, err}（只被 hm-pages.py 的 #result 单通道读取——
  //   坑 115 纪律：不经 title 快通道）
  (async function () {
    const fail = (m) => {
      document.getElementById('result').textContent = JSON.stringify({ ok: false, texts: [], err: m });
    };
    try {
      const q = new URLSearchParams(location.search);
      const mod = q.get('mod'), reg = q.get('reg'), route = q.get('route');
      if (!mod || !route) { fail('缺 mod/route 参数'); return; }
      console.log('[harness] 加载 ' + mod);
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = mod;
        s.onload = () => { console.log('[harness] 模块 onload'); res(); };
        s.onerror = () => rej(new Error('模块加载失败: ' + mod));
        document.head.appendChild(s);
      });
      // cjs 包装件需要 requireModule 触发工厂（factory 里才有 registerNamedRoute）；
      // classic 件脚本加载即已自注册——缺 id 时跳过
      if (reg) { try { __arkui_dom_requireModule(reg); } catch (e) { /* classic 件无 id */ } }
      console.log('[harness] loadRoute ' + route);
      __arkui_dom_loadRoute(route, document.getElementById('root'));
      console.log('[harness] loadRoute 返回');
      // 结算用 setTimeout（虚拟时钟下 rAF 在动态注入路径不派发——实测卡 running；
      // 测试页 tick()=setTimeout 是已验证惯例）
      await new Promise((r) => setTimeout(r, 400));
      // 可见文本流：#root 按文档序收集——文本节点 + input/textarea/select 的 value
      // （R165 口径归一：真机 a11y 树含 value 型组件的显示值，浏览器 textContent
      // 不含——TextDemo 31v7 实锤即此口径差，采集端补齐后两侧同口径）
      const collect = () => {
        const parts = [];
        const scope = document.getElementById('root');
        const els = scope.querySelectorAll('*');
        for (const e of els) {
          // R166 续（H0）：不可见子树跳过——真机 a11y 树只含可见内容，display:none
          // （ShowDemo 隐藏项/Swiper 非当前页等）在设备侧不进 dumpLayout。visibility
          // 与 display:contents（ForEach 透传层，子仍可见）不跳。
          const cs = getComputedStyle(e);
          if (cs.display === 'none' || cs.visibility === 'hidden') continue;
          // R166 续（C 接管）：aria-hidden 也不进——真机 a11y 树不含装饰文本（跑马灯
          // 内容/侧栏箭头/非当前 Swiper 页），屏幕阅读器语义同此
          if (e.getAttribute('aria-hidden') === 'true') continue;
          // R170：Badge 容器值——真机 dumpLayout 实测 Badge 容器节点自带 text=徽标值
          // （a11y 分组把徽标值挂在容器上），runtime 落 aria-label + data-arkui-badge-root；
          // 此处按文档序在子文本之前采集（容器 attr 先于子节点，同设备 dump 序）
          if (e.hasAttribute('data-arkui-badge-root')) {
            const bv = String(e.getAttribute('aria-label') || '');
            if (bv.trim()) parts.push(bv);
          }
          // R166 续：折叠 <select> 的 <option> 子文本不进流——真机折叠态 a11y 只报
          // 选中值（选项列表仅展开时报；设备 PopDemo 无 ABCXY），选中值由下方
          // SELECT.value 通道采集
          if (e.tagName === 'OPTION') continue;
          if (e.tagName === 'INPUT' || e.tagName === 'TEXTAREA' || e.tagName === 'SELECT') {
            // R166 续（设备对拍 InputDemo/BatchInputDemo/BatchVerifyDemo）：控件 a11y
            // 口径——checkbox/checkboxgroup/radio 的身份文本（name/group/value）由
            // runtime 落 input.value；slider 的 %f 格式值（'40.000000'，range 控件的
            // value 属性被浏览器规范化装不下）由 runtime 落 aria-valuetext，采集优先取它。
            // SELECT 特化：取【选中 option 的 textContent】=可见显示语义（真机
            // value() 覆盖文本 'Choosed' 即此通道；value 属性恒为原值不反映覆盖）
            let v = '';
            if (e.tagName === 'SELECT') {
              const sel = e.selectedIndex >= 0 ? e.options[e.selectedIndex] : null;
              v = String(sel ? sel.textContent : '');
            } else {
              v = String(e.getAttribute('aria-valuetext') || e.value || '');
            }
            if (v.trim()) parts.push(v);
          }
          for (const c of e.childNodes) {
            if (c.nodeType === Node.TEXT_NODE) {
              const t = c.nodeValue || '';
              if (t.trim()) parts.push(t);
            }
          }
        }
        return parts;
      };
      // R166 续：稳定轮询——初等 400ms 后每 300ms 重采，连续两采样相等才落定
      //（上限 8s）。实证：animatordemo 的 FIN 在 1.5-2.5s 才进 DOM（动画链+延时派发+
      // rerender），固定 settle 400/1000 均会采到中间态（时序类假 DIFF）
      let prev = JSON.stringify(collect());
      let parts = JSON.parse(prev);
      let same = 0;
      for (let i = 0; i < 26; i++) {
        await new Promise((r) => setTimeout(r, 300));
        const cur = JSON.stringify(collect());
        if (i >= 10 && cur === prev) {           // 前 10 次（3s）保底——动画 log 是稀疏
          same += 1;                             // 事件，早段采样相等≠动画完（FIN 1.5-2.5s）
          if (same >= 2) break;
        } else {
          same = 0;
        }
        prev = cur;
        parts = JSON.parse(cur);
      }
      document.getElementById('result').textContent = JSON.stringify({ ok: true, texts: parts });
    } catch (e) {
      fail(String(e && e.stack || e));
    }
  })();
  </script>
</body>
</html>
