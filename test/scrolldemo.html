<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R46：Scroll 滚动容器（overflow 基座 + Scroller + 滚动条 + 事件）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 360px; }
  #root [data-arkui-comp="Scroll"] { border: 1px solid #ddd; }
  #root [data-arkui-comp="Scroll"] p { margin: 0; padding: 8px; background: #f4f6f8; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R46：Scroll（基座 / Scroller.scrollTo·scrollBy·scrollEdge / onScroll·onScrollEdge·onScrollEnd）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/scrolldemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');
    const click = async (sel) => {
      const n = root.querySelector(sel);
      if (!n) { check(false, '要点击的节点不存在：' + sel); return; }
      n.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
      await tick(30);
    };
    const group = async (name, fn) => {
      try { await fn(); } catch (e) {
        allPass = false;
        lines.push(`FAIL [${name}] 抛出异常：${e && e.stack ? String(e.stack).split('\n')[0] : e}`);
      }
    };
    const waitLog = async (probe, cap = 3000) => {
      const t0 = Date.now();
      while (!txt('sc-log').includes(probe) && Date.now() - t0 < cap) await tick(40);
      await tick(120);      // onScrollEnd 收口是 80ms 静默（R46 DOM 化近似）
    };

    try {
      __arkui_dom_requireModule('ScrollDemo');
      __arkui_dom_loadRoute('pages/ScrollDemo', root);
      await tick(120);
      const sc = el('sc1');
      check(!!sc && sc.tagName === 'DIV' && !!el('r0') && !!el('r11'), 'ScrollDemo 页面已渲染');

      // ══════════ ① 基座：overflow 基座 + 可滚余量 + 滚动条隐藏 ══════════
      await group('基座', async () => {
        check(sc.style.overflowY === 'auto', `overflowY:auto（实际 '${sc.style.overflowY}'）`);
        check(sc.scrollHeight > sc.clientHeight,
          `内容 480 超出视口 200（scrollHeight=${sc.scrollHeight} clientHeight=${sc.clientHeight}）`);
        check(sc.dataset.scrollable === '0' && sc.dataset.scrollBar === '0',
          `枚举数值记录（scrollable='${sc.dataset.scrollable}' scrollBar='${sc.dataset.scrollBar}'）`);
        check(getComputedStyle(sc).scrollbarWidth === 'none'
          || getComputedStyle(sc).getPropertyValue('scrollbar-width') === 'none',
          `scrollBar(Off=0) → 滚动条隐藏（scrollbar-width=${getComputedStyle(sc).scrollbarWidth}）`);
        check(sc.dataset.edgeEffect === '2' && sc.style.overscrollBehavior === 'none',
          `edgeEffect(None=2) → overscroll:none（'${sc.dataset.edgeEffect}'/'${sc.style.overscrollBehavior}'）`);
      });

      // ══════════ ② Scroller：scrollTo / scrollBy / currentOffset / scrollEdge / isAtEnd ══════════
      await group('Scroller', async () => {
        await click('#btn-by');                        // scrollBy(0, 60)
        check(sc.scrollTop === 60, `scrollBy(0,60) → scrollTop=60（实际 ${sc.scrollTop}）`);
        await click('#btn-w');                         // currentOffset()
        check(txt('sc-log').includes('@60;'),
          `currentOffset().yOffset = 真实 scrollTop（log 尾='${txt('sc-log').slice(-4)}'）`);
        await click('#btn-b');                         // scrollTo({xOffset:0, yOffset:9999})
        check(Math.abs(sc.scrollTop - (sc.scrollHeight - sc.clientHeight)) <= 1,
          `scrollTo(9999) 夹到最大滚距（scrollTop=${sc.scrollTop}，max=${sc.scrollHeight - sc.clientHeight}）`);
        await click('#btn-t');                         // scrollEdge(Edge.Top)
        check(sc.scrollTop === 0, `scrollEdge(Top) → 回顶（scrollTop=${sc.scrollTop}）`);
      });

      // ══════════ ③ 事件：onScroll / onScrollEnd / onScrollEdge 到达沿 ══════════
      // 坑 ⑧ 同族：浏览器滚动事件对齐 rAF，headless 虚拟时间下不可靠——手动派发（lazy.html 同约定）
      const userScroll = (top) => { sc.scrollTop = top; sc.dispatchEvent(new Event('scroll')); };
      await group('事件', async () => {
        userScroll(70);                                // 滚到 70（未到边）
        await tick(200);                               // onScrollEnd 收口 80ms 静默
        check(sc.scrollTop === 70, `手动滚 70px（scrollTop=${sc.scrollTop}）`);
        check(txt('sc-log').includes('S70;'), `onScroll(0,70) → log 'S70;'（log 尾='${txt('sc-log').slice(-6)}'）`);
        check(txt('sc-log').includes('END;'), `onScrollEnd 收口（80ms 静默，DOM 化近似）`);
        userScroll(0);                                 // 回顶 → onScrollEdge('top') 到达沿
        await tick(200);
        check(txt('sc-log').includes('E:top;'), `回顶 → onScrollEdge('top')（log='${txt('sc-log')}'）`);
        userScroll(30);                                // 离开顶部（不触发）
        await tick(200);
        userScroll(0);                                 // 再次到顶 → 再触发
        await tick(200);
        check(txt('sc-log').split('E:top;').length >= 3,
          `到达沿语义：离开后再到才再发（'top' 共 ${txt('sc-log').split('E:top;').length - 1} 次）`);
      });

      // ══════════ ④ 回归 ══════════
      await group('回归', async () => {
        const bad = __arkui_dom_layout_warnings.filter((w) => /Scroll\./.test(String(w)) && /未实现/.test(String(w)));
        check(bad.length === 0, `Scroll 属性不记"未实现"警告（剩 ${bad.length} 条）`);
      });

      lines.push(`LOG='${txt('sc-log').slice(-40)}'`);
      lines.push(`ELMT ${__arkui_dom_elmtRecords.size}`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';


  })();
  </script>
</body>
</html>
