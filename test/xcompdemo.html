<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R32：表层类 XComponent（surface 占位 / onLoad / Controller rect）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 320px; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R32：XComponent（surface 占位 / onLoad / surfaceId / rect 读写）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/xcompdemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');
    const group = async (name, fn) => {
      try { await fn(); } catch (e) {
        allPass = false;
        lines.push(`FAIL [${name}] 抛出异常：${e && e.stack ? String(e.stack).split('\n')[0] : e}`);
      }
    };

    try {
      __arkui_dom_requireModule('XCompDemo');
      __arkui_dom_loadRoute('pages/XCompDemo', root);
      await tick(80);
      check(!!el('xc-main') && !!el('xc-log'), 'XCompDemo 页面已渲染');
      await tick(60);                       // onLoad 经 setTimeout(0) 派发

      // ══════════ ① surface 占位 + onLoad + surfaceId ══════════
      await group('surface·onLoad', async () => {
        check(el('xc-main').dataset.xcomponent !== undefined,
          `占位容器（data-xcomponent，type=${el('xc-main').dataset.xcType}）`);
        check(txt('xc-log').includes('LOAD1;'), `onLoad 触发且 surfaceId 非空（log='${txt('xc-log')}'）`);
        check(el('xc-main').offsetWidth === 300 && el('xc-main').offsetHeight === 200,
          `组件尺寸 = 300×200（实际 ${el('xc-main').offsetWidth}×${el('xc-main').offsetHeight}）`);
      });

      // ══════════ ② rect 默认 = 组件实际尺寸（JSDoc 原文）══════════
      await group('rect·默认', async () => {
        el('probe-btn').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
        await tick(30);
        check(txt('xc-log').includes('DEF300x200;'), `不调用 set → 组件实际尺寸（log 含 'DEF300x200;'）`);
      });

      // ══════════ ③ rect set/get：写入后返回记录值 ══════════
      await group('rect·set/get', async () => {
        el('rect-btn').dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
        await tick(30);
        check(txt('xc-log').includes('RECT320x240;'), `set 后 get 返回记录值（log 含 'RECT320x240;'）`);
      });

      // ══════════ ④ 回归：没有"未实现"假警告 ══════════
      await group('回归', async () => {
        const bad = __arkui_dom_layout_warnings.filter((w) => /XComponent\./.test(String(w)));
        check(bad.length === 0, `XComponent 属性不再记"未实现"警告（剩 ${bad.length} 条：${bad.slice(0, 2).join('|')}）`);
      });

      lines.push(`XC log='${txt('xc-log')}'`);
      lines.push(`ELMT ${__arkui_dom_elmtRecords.size}`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';
  })();
  </script>
</body>
</html>
