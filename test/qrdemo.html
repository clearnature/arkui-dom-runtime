<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R33：QRCode（真实编码器 + 独立解码交叉验证）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 320px; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R33：QRCode（vendor 编码器 / 默认色 / 定制色 / jsQR 独立解码交叉验证）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../runtime/vendor/arkui-qrcodegen.js"></script>
  <script src="../test/vendor/jsqr-1.4.0.js"></script>
  <script src="../build/qrdemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');
    // 读 canvas 像素 → jsQR（独立解码器）→ 解码文本
    const decodeCanvas = (id) => {
      const cv = el(id);
      const native = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height);
      const out = window.jsQR(native.data, cv.width, cv.height);
      return out ? out.data : null;
    };
    const group = async (name, fn) => {
      try { await fn(); } catch (e) {
        allPass = false;
        lines.push(`FAIL [${name}] 抛出异常：${e && e.stack ? String(e.stack).split('\n')[0] : e}`);
      }
    };

    try {
      __arkui_dom_requireModule('QrDemo');
      __arkui_dom_loadRoute('pages/QrDemo', root);
      await tick(120);                     // 首绘在渲染后同步阶段（syncDrawings）
      check(!!el('qr1') && !!el('qr2') && !!el('qr3'), 'QrDemo 页面已渲染');

      // ══════════ ① 渲染落位：三个 canvas 都画出来了 ══════════
      await group('渲染落位', async () => {
        check(el('qr1').tagName === 'CANVAS', `沿用原生 <canvas>（tag=${el('qr1').tagName}）`);
        check(el('qr1').dataset.qrRendered !== undefined
          && Number(el('qr1').dataset.qrRendered) > 25,
          `矩阵已画（总模块数含 quiet zone：${el('qr1').dataset.qrRendered}）`);
        check(!!el('qr2').dataset.qrRendered && !!el('qr3').dataset.qrRendered, 'qr2/qr3 同样渲染');
      });

      // ══════════ ② 交叉验证：jsQR（独立实现）解码回原文 ══════════
      await group('独立解码', async () => {
        check(decodeCanvas('qr1') === 'https://example.com/qr-test-123',
          `qr1 解码回原文（'${decodeCanvas('qr1')}'）`);
        check(decodeCanvas('qr2') === '你好 QR 码 123',
          `qr2（UTF-8 多字节）解码回原文（'${decodeCanvas('qr2')}'）`);
        check(decodeCanvas('qr3') === 'https://example.com/colored',
          `qr3（定制色）同样可解码（'${decodeCanvas('qr3')}'）`);
      });

      // ══════════ ③ 像素断言：前景/背景色（默认与定制）══════════
      await group('颜色', async () => {
        const n1 = el('qr1').getContext('2d').getImageData(5, 5, 1, 1);
        check(n1.data[3] === 255 && n1.data[0] === 255,
          `默认背景（#ffffffff）左上角空白 → 不透明白（R${n1.data[0]} A${n1.data[3]}）`);
        const n3 = el('qr3').getContext('2d').getImageData(5, 5, 1, 1);
        check(n3.data[0] === 238 && n3.data[1] === 238 && n3.data[2] === 255,
          `定制背景 '#eeeeff'（rgb(238,238,255)，实际 ${n3.data[0]}/${n3.data[1]}/${n3.data[2]}）`);
      });

      // ══════════ ③b 编码器对照（R41）：渲染矩阵 = 真机编码器 MEDIUM 输出 ══════════
      await group('编码器对照', async () => {
        const qr = el('qr1');
        const v = qr.__arkuiQrValue;
        const med = window.ArkuiQrcodegen.encode(v, 0).data;   // 真机 MEDIUM（组件硬编码档位）
        const high = window.ArkuiQrcodegen.encode(v, 1).data;  // HIGH 档位：同一内容矩阵必不同
        const size = window.ArkuiQrcodegen.encode(v, 0).width;
        const cell = Math.max(1, Math.floor(Math.min(qr.width, qr.height) / (size + 8)));
        const offX = Math.floor((qr.width - cell * (size + 8)) / 2);
        const offY = Math.floor((qr.height - cell * (size + 8)) / 2);
        const ctx = qr.getContext('2d');
        // 在 MEDIUM 矩阵上隔 3 格采样：渲染像素的暗/亮必须逐格一致（渲染路径守卫；
        // 独立性由 ② 的 jsQR 交叉验证承担——解码器与编码器来自不同实现）
        let ok = 0, n = 0, medHighDiff = false;
        for (let i = 0; i < med.length; i++) if (med[i] !== high[i]) medHighDiff = true;
        for (let y = 0; y < size; y += 3) {
          for (let x = 0; x < size; x += 3) {
            n++;
            const d = ctx.getImageData(offX + (4 + x) * cell + (cell >> 1), offY + (4 + y) * cell + (cell >> 1), 1, 1).data;
            if ((d[0] < 128) === !!med[y * size + x]) ok++;
          }
        }
        check(ok === n && medHighDiff,
          `渲染矩阵 = 真机编码器 MEDIUM 输出（采样 ${ok}/${n} 一致；MEDIUM/HIGH 矩阵可区分）`);
      });

      // ══════════ ③c 组件过小拒绝绘制（R44 照真机 qrcode_modifier.cpp:55 的尺寸守卫）══════════
      await group('过小拒绝', async () => {
        const before = (__arkui_dom_layout_warnings || []).length;
        // 路由外 DSL 建一个 20px 的 QRCode：矩阵 29 + quiet 8 = 37px 需求 > 20 → 真机会拒绝
        QRCode.create('tiny');
        QRCode.width(20);
        QRCode.height(20);
        QRCode.id('qr-tiny');
        QRCode.pop();
        __arkui_dom_syncDrawings(root);        // DSL 建的元素不经过渲染管线，手动触发补画
        await tick(60);
        const tiny = el('qr-tiny');
        check(!!tiny && tiny.dataset.qrRendered === undefined,
          `过小组件拒绝绘制（qrRendered='${tiny && tiny.dataset.qrRendered}'，真机 qrCodeSize<qrWidth 即返回）`);
        const w = (__arkui_dom_layout_warnings || []).slice(before).map(String);
        check(w.some((m) => /拒绝绘制/.test(m) && /小于矩阵所需/.test(m)),
          `拒绝时出声（'${(w.find((m) => /拒绝绘制/.test(m)) || '(无)').slice(0, 70)}'）`);
        const before2 = (__arkui_dom_layout_warnings || []).length;
        __arkui_dom_syncDrawings(root);        // 再触发：pending 已清 → 不重复尝试/不出声
        await tick(60);
        check(tiny.dataset.qrRendered === undefined
          && (__arkui_dom_layout_warnings || []).length === before2,
          `不会在后续补画里悄悄重试（只尝试一次，qrRendered='${tiny.dataset.qrRendered}'）`);
      });

      // ══════════ ④ 回归：没有"未实现"假警告 ══════════
      await group('回归', async () => {
        const bad = __arkui_dom_layout_warnings.filter((w) => /QRCode\./.test(String(w)));
        check(bad.length === 0, `QRCode 属性不再记"未实现"警告（剩 ${bad.length} 条：${bad.slice(0, 2).join('|')}）`);
        check(typeof window.ArkuiQrcodegen.encode === 'function', '真机编码器 vendor 已加载（arkui-qrcodegen WASM）');
      });

      lines.push(`QR rendered=${el('qr1').dataset.qrRendered} dec='${decodeCanvas('qr1')}'`);
      lines.push(`ELMT ${__arkui_dom_elmtRecords.size}`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';
  })();
  </script>
</body>
</html>
