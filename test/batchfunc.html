<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R66：批量功能组件（Repeat / WithTheme / MenuItemGroup / IndicatorComponent / ContainerReader / Calendar）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 420px; }
  #root [data-arkui-comp="Calendar"] { border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
  #root [data-cal-day], #root [data-cal-week] { padding: 2px 0; }
  #root [data-cal-day][data-selected="true"] { background: #1976d2; color: #fff; border-radius: 4px; }
  #root [data-cal-day][data-today="true"] { outline: 1px solid #B3261E; }
  #root [data-cal-day][data-off-day="true"] { color: #c62828; }
  #root [data-indic-dot][data-indic-active="true"] { background: #1976d2 !important; }
  #root [data-arkui-mig-header], #root [data-arkui-mig-footer] { color: #888; font-size: 12px; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R66：Repeat / WithTheme / MenuItemGroup / IndicatorComponent / ContainerReader / Calendar</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/batchfuncdemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');

    try {
      __arkui_dom_requireModule('BatchFuncDemo');
      __arkui_dom_loadRoute('pages/BatchFuncDemo', root);
      await tick(160);   // Repeat/Calendar/Indicator 的 microtask 渲染 + 首帧

      // ══════════ ① Repeat（4 + R153-A 11 + R154-A 8 + R155-A 7 + R156-A 9 + R158-A 10 条） ══════════
      const rep = root.querySelector('[data-arkui-repeat]');
      check(!!rep && rep.style.display === 'contents',
        `Repeat 基座：display:contents 逻辑容器（实际 '${rep && rep.style.display}'）`);
      check(rep && rep.dataset.repeatCount === '4' && !!el('rep-0') && !!el('rep-3'),
        `Repeat 渲染 4 项（rep-0..3，dataset.repeatCount='${rep && rep.dataset.repeatCount}'）`);
      check(!el('rep-4') && !el('rep-5'),
        `virtualScroll({totalCount:4}) 裁剪：rep-4/rep-5 不渲染（6 项数据源）`);
      check(txt('rep-2') === 'Rc',
        `each(ri) 收到 RepeatItem：#rep-2 文本 'Rc'（实际 '${txt('rep-2')}'）`);

      // ── R153-A：键 diff 三分支复用语义（runtime 级直构第二个 Repeat 实例，Repeat.create 全局直调）──
      const R = (/** @type {any} */ (globalThis)).Repeat;
      const rdRis = {};                    // itemId → 最近一次 builder 收到的 ri（验 RepeatItem 状态对象）
      const rdArr = [{ id: 'a', name: 'A1' }, { id: 'b', name: 'B1' }, { id: 'c', name: 'C1' }];
      const rdRep = R.create(rdArr, null);
      R.each((ri) => {
        rdRis[ri.item.id] = ri;            // 不解构：整对象持有（repeat.d.ts:279-286）
        Column.create();
        Column.id('rd-' + ri.item.id);
        Text.create(ri.item.id + '@' + ri.index + ':' + ri.item.name);
        Text.fontSize(12);
        Text.pop();
        Column.pop();
      });
      R.key((item) => item.id);            // 键 = item 身份（与 index 无关，重排可走"键保留"分支）
      R.pop();
      await tick(20);                      // microtask 键 diff 渲染
      const rdTxt = (id) => { const t = root.querySelector('#' + id); return t ? t.textContent : '<缺>'; };
      check(rdRep && rdRep.dataset.repeatCount === '3' && rdRis.a
        && rdRis.a.item === rdArr[0] && rdRis.a.index === 0,
        `RepeatItem 状态对象：ri.item 同源 rdArr[0]、index=0（repeatCount='${rdRep && rdRep.dataset.repeatCount}'）`);

      // case#1 键保留：重排 [c,a,b] → 同 key 节点身份不变 + 位置正确 + index 原地改写
      const rdA = root.querySelector('#rd-a');
      const rdB = root.querySelector('#rd-b');
      const rdC = root.querySelector('#rd-c');
      const riA = rdRis.a;
      __arkui_dom_repeatUpdate(rdRep, [rdArr[2], rdArr[0], rdArr[1]]);
      await tick(20);
      check(root.querySelector('#rd-a') === rdA && root.querySelector('#rd-b') === rdB
        && root.querySelector('#rd-c') === rdC,
        `键保留复用：重排后 #rd-a/#rd-b/#rd-c 节点对象引用不变（DOM 身份保持，异于 ForEach 整体重建）`);
      check(rdRep.children[0] === rdC && rdRep.children[1] === rdA && rdRep.children[2] === rdB,
        `moveChild 顺序：子节点序 = 新数组序 [c,a,b]`);
      check(rdRis.a === riA && riA.index === 1,
        `RepeatItem 原地改写：同一 ri 实例、index 0→1（不解构的响应性等价）`);
      check(rdTxt('rd-a') === 'a@1:A1',
        `键保留重放：#rd-a 文本随 index 重烘（'${rdTxt('rd-a')}'）`);

      // case#2 池复用：b 键消失入池 → 新键 e 复用 b 的节点对象（内容更新而非新建）
      const rdBold = root.querySelector('#rd-b');
      __arkui_dom_repeatUpdate(rdRep, [rdArr[2], rdArr[0]]);      // c,a：b 键消失
      await tick(20);
      check(!root.querySelector('#rd-b') && rdRep.dataset.repeatCount === '2',
        `键消失入池：#rd-b 移除、repeatCount='2'（实际 '${rdRep.dataset.repeatCount}'）`);
      __arkui_dom_repeatUpdate(rdRep, [rdArr[2], rdArr[0], { id: 'e', name: 'E1' }]);
      await tick(20);
      const rdE = root.querySelector('#rd-e');
      check(rdE === rdBold && rdE.textContent === 'e@2:E1',
        `池复用：新键 e 复用消失项 b 的节点对象（同一引用）且内容已更新（'${rdE && rdE.textContent}'）`);
      check(rdRis.e === rdRis.b && rdRis.e.item.id === 'e',
        `复用走 updateItem/updateIndex：b 的 ri 原地改写为 e（同一状态对象）`);

      // case#3 新建：池已空，新键 d → 全新节点 + 顺序保持
      const rdSeen = new Set([rdA, rdB, rdC, rdBold, rdE]);
      __arkui_dom_repeatUpdate(rdRep, [rdArr[2], rdArr[0], { id: 'e', name: 'E1' }, { id: 'd', name: 'D1' }]);
      await tick(20);
      const rdD = root.querySelector('#rd-d');
      check(!!rdD && !rdSeen.has(rdD),
        `新键新建：池空后 #rd-d 是全新节点（不在历史节点集合）`);
      const rdTops = Array.from(rdRep.children).map((c) => c.offsetTop);
      check(rdTops.every((t, k) => k === 0 || t >= rdTops[k - 1]),
        `顺序保持：moveChild 回填后 offsetTop 单调（${rdTops.join(',')}）`);

      // 重复键：告警 + 整体回退缺省键全量重渲染（真机 "Correct the key gen function"）
      const warnBefore = __arkui_dom_layout_warnings.length;
      __arkui_dom_repeatUpdate(rdRep, [{ id: 'x', name: 'X1' }, { id: 'x', name: 'X2' }, { id: 'y', name: 'Y1' }]);
      await tick(20);
      const dupMsgs = __arkui_dom_layout_warnings.slice(warnBefore);
      const rdTexts = Array.from(rdRep.children).map((c) => c.textContent).join('|');
      check(dupMsgs.some((m) => String(m).indexOf('重复键') >= 0) && rdTexts === 'x@0:X1|x@1:X2|y@2:Y1',
        `重复键 → layoutWarnings 告警 + 回退缺省键全量重渲染（'${rdTexts}'）`);

      // ── R154-A：onMove 拖拽换位派发（独立第三个 Repeat 实例）──
      // 真机协议（pu_repeat_virtual_scroll_2_impl.ts:71-83）：拖拽中框架重排视觉节点 →
      // 落定 FireOnMove 单发回调（两参裸 number from/to——pu_foreach.d.ts:45，无事件对象）→
      // 数据源 splice（垫片把这一步折叠进 __arkui_dom_repeatMove，回调里不要再 splice）→
      // rerender。__arkui_dom_repeatMove(node, from, to) = 一次完整的"拖拽落定"。
      const mvArr = [{ id: 'p', name: 'P1' }, { id: 'q', name: 'Q1' },
        { id: 'r', name: 'R1' }, { id: 's', name: 'S1' }];
      const mvRep = R.create(mvArr, null);
      const mvMoves = [];
      const mvRis = {};
      R.each((ri) => {
        mvRis[ri.item.id] = ri;
        Column.create();
        Column.id('mv-' + ri.item.id);
        Text.create(ri.item.id + '@' + ri.index);
        Text.pop();
        Column.pop();
      });
      R.key((item) => item.id);
      R.onMove((from, to) => { mvMoves.push([from, to]); });
      R.pop();
      await tick(20);
      check(mvRep.dataset.onMove === 'registered' && mvRep.dataset.repeatCount === '4',
        `onMove 登记：dataset.onMove='registered'（实际 '${mvRep.dataset.onMove}'）`);
      const mvP = root.querySelector('#mv-p');
      const riP0 = mvRis.p;                    // 移动前捕获 ri 引用（验原地改写不换对象）
      const mvOrder = () => Array.from(mvRep.children)
        .map((/** @type {any} */ c) => c.id.replace('mv-', '')).join('');
      const movedOk = /** @type {boolean} */ (__arkui_dom_repeatMove(mvRep, 0, 2));   // p 拖到 r 后
      check(movedOk === true && mvMoves.length === 1 && mvMoves[0].length === 2
        && mvMoves[0][0] === 0 && mvMoves[0][1] === 2,
        `onMove 回调两参裸 number：(from,to)=(${mvMoves.length ? mvMoves[0][0] : '?'},`
        + `${mvMoves.length ? mvMoves[0][1] : '?'})——无事件对象`);
      check(mvOrder() === 'qrps' && mvArr.map((/** @type {any} */ x) => x.id).join('') === 'qrps',
        `落定即生效：DOM 视觉重排同步完成（'${mvOrder()}'）且数据源已 splice（'`
        + `${mvArr.map((/** @type {any} */ x) => x.id).join('')}'）`);
      await tick(20);
      check(Array.from(mvRep.children).map((/** @type {any} */ c) => c.textContent).join('|')
        === 'q@0|r@1|p@2|s@3',
        `键 diff 收口：子节点 textContent 序列 = 新数组序（'`
        + `${Array.from(mvRep.children).map((/** @type {any} */ c) => c.textContent).join('|')}'）`);
      check(root.querySelector('#mv-p') === mvP && mvRis.p === riP0
        && (/** @type {any} */ (mvRis.p)).index === 2 && (/** @type {any} */ (mvRis.q)).index === 0,
        `RepeatItem 原地改写：#mv-p 节点引用不变、ri.index 0→2（identity 保持）`);
      const warnBeforeMove = __arkui_dom_layout_warnings.length;
      const movedSelf = /** @type {boolean} */ (__arkui_dom_repeatMove(mvRep, 1, 1));
      check(movedSelf === false && mvMoves.length === 1 && mvOrder() === 'qrps'
        && __arkui_dom_layout_warnings.slice(warnBeforeMove)
          .some((/** @type {string} */ m) => String(m).indexOf('非法换位') >= 0),
        `from==to 不派发不重排（真机 for_each_base_node.h:33 / repeat_node.cpp:154 口径），告警含'非法换位'`);

      // virtualScroll 共存：totalCount 裁剪内换位（真机虚拟路径同一协议，平移表换 DOM 重排）
      const vsArr = [{ id: 'u', name: 'U1' }, { id: 'v', name: 'V1' },
        { id: 'w', name: 'W1' }, { id: 'x2', name: 'X1' }];
      const vsRep = R.create(vsArr, null);
      const vsMoves = [];
      R.each((ri) => {
        Column.create();
        Column.id('vs-' + ri.item.id);
        Text.create(ri.item.id + '@' + ri.index);
        Text.pop();
        Column.pop();
      });
      R.key((item) => item.id);
      R.virtualScroll({ totalCount: 3 });
      R.onMove((from, to) => { vsMoves.push([from, to]); });
      R.pop();
      await tick(20);
      const movedVs = /** @type {boolean} */ (__arkui_dom_repeatMove(vsRep, 2, 0));   // w 尾→头
      const vsOrder = () => Array.from(vsRep.children)
        .map((/** @type {any} */ c) => c.id.replace('vs-', '')).join('');
      check(movedVs === true && vsMoves.length === 1 && vsMoves[0][0] === 2 && vsMoves[0][1] === 0
        && vsOrder() === 'wuv' && vsArr.map((/** @type {any} */ x) => x.id).join('') === 'wuvx2',
        `与 virtualScroll 共存：裁剪内换位 (2,0) 不炸，DOM 序 '${vsOrder()}'、数据源同步`);
      await tick(20);
      check(vsRep.dataset.repeatCount === '3' && !root.querySelector('#vs-x2')
        && Array.from(vsRep.children).map((/** @type {any} */ c) => c.textContent).join('|')
          === 'w@0|u@1|v@2',
        `virtualScroll 共存收口：仍裁剪 3 项（x2 不渲染）、textContent 序列 '`
        + `${Array.from(vsRep.children).map((/** @type {any} */ c) => c.textContent).join('|')}'`);

      // ── R155-A：onLazyLoading 数据源懒加载派发（独立第四个 Repeat 实例）──
      // 真机协议（pu_repeat_virtual_scroll_2_impl.ts:401-414）：容器布局按需取项 → 缺数据索引
      // 同步单发 onLazyLoading(index)（单参裸 number = 待加载数据项绝对索引，repeat.d.ts:173）
      // → 开发者回调里 arr[index]=item（真机只许写该索引，其他操作 BusinessError 103804）→
      // 键 diff 新建分支渲染。DOM 垫片无滚动容器取项管线 → __arkui_dom_repeatLazy(node, index)
      // 驱动（同 onMove 先例）。
      const lzArr = [{ id: 'la', name: 'LA' }, { id: 'lb', name: 'LB' }, { id: 'lc', name: 'LC' }];
      const lzRep = R.create(lzArr, null);
      const lzCalls = [];
      const lzSupply = { 3: { id: 'ld', name: 'LD' } };   // 各步骤放开给回调写入的数据
      R.each((ri) => {
        Column.create();
        Column.id('lz-' + ri.item.id);
        Text.create(ri.item.id + '@' + ri.index);
        Text.pop();
        Column.pop();
      });
      R.key((item) => item.id);
      const warnBeforeLazy = __arkui_dom_layout_warnings.length;
      R.virtualScroll({
        totalCount: 6,
        onLazyLoading: (index) => {
          lzCalls.push(index);
          const d = lzSupply[index];
          if (d) lzArr[index] = d;           // 真机契约：arr[index] = item（只写该索引）
        },
      });
      R.pop();
      await tick(20);
      const lzWarns = __arkui_dom_layout_warnings.slice(warnBeforeLazy).map(String);
      check(lzRep.dataset.onLazyLoading === 'registered' && lzRep.dataset.virtualScroll === 'on'
        && lzRep.dataset.repeatCount === '3'
        && lzWarns.some((/** @type {string} */ m) => m.indexOf('已登记') >= 0)
        && lzWarns.every((/** @type {string} */ m) => m.indexOf('未实现真懒加载') < 0),
        `onLazyLoading 登记面：dataset.onLazyLoading='registered'、totalCount=6 但缺口不渲染`
        + `（repeatCount='3'，实际 '${lzRep.dataset.repeatCount}'）；'未实现真懒加载'占位警告已被真实现登记注释取代`);
      const gotLz = /** @type {boolean} */ (__arkui_dom_repeatLazy(lzRep, 3));
      check(gotLz === true && lzCalls.length === 1 && typeof lzCalls[0] === 'number'
        && lzCalls[0] === 3,
        `驱动钩子派发：__arkui_dom_repeatLazy(lzRep, 3) → true，回调收到单参裸 number 3`
        + `（待加载项绝对索引，非"距 totalCount 差值"；实际 '${lzCalls.join(',')}'）`);
      await tick(20);
      const lzD = root.querySelector('#lz-ld');
      check(!!lzD && lzD.textContent === 'ld@3' && lzRep.dataset.repeatCount === '4',
        `回调写 arr[3] → 键 diff 新建分支接管：#lz-ld 渲染 '${lzD && lzD.textContent}'、`
        + `repeatCount='4'（实际 '${lzRep.dataset.repeatCount}'）`);
      const warnBeforeLzBad = __arkui_dom_layout_warnings.length;
      const badLz = /** @type {boolean} */ (__arkui_dom_repeatLazy(lzRep, 9));
      const dupLz = /** @type {boolean} */ (__arkui_dom_repeatLazy(lzRep, 2));
      check(badLz === false && dupLz === false && lzCalls.length === 1
        && __arkui_dom_layout_warnings.slice(warnBeforeLzBad)
          .some((/** @type {string} */ m) => String(m).indexOf('非法索引') >= 0),
        `非法派发：index=9（≥ totalCount 窗口 6）→ false + '非法索引'告警；index=2 数据已在 → `
        + `false 且不派发（真机 :403 !(index in arr_) 守卫，lzCalls 不变）`);
      const warnBeforeLzDry = __arkui_dom_layout_warnings.length;
      const dryLz = /** @type {boolean} */ (__arkui_dom_repeatLazy(lzRep, 4));
      await tick(20);
      check(dryLz === false && lzCalls.length === 2 && lzCalls[1] === 4
        && !root.querySelector('#lz-le') && lzRep.dataset.repeatCount === '4'
        && __arkui_dom_layout_warnings.slice(warnBeforeLzDry)
          .some((/** @type {string} */ m) => String(m).indexOf('did not provide data') >= 0),
        `不追加数据不重派发（防死循环）：index=4 回调未写数据 → 单发 1 次（lzCalls 恰 +1，`
        + `无重试）、#lz-le 不渲染、告警含真机 applicationError 文案 did not provide data`);
      lzSupply[4] = { id: 'le', name: 'LE' };
      const refillsLz = /** @type {boolean} */ (__arkui_dom_repeatLazy(lzRep, 4));
      await tick(20);
      check(refillsLz === true && lzCalls.length === 3 && !!root.querySelector('#lz-le')
        && lzRep.dataset.repeatCount === '5'
        && Array.from(lzRep.children).map((/** @type {any} */ c) => c.textContent).join('|')
          === 'la@0|lb@1|lc@2|ld@3|le@4',
        `新请求可再问 + 补齐渲染：再次驱动 index=4（真机每次布局请求独立单发）→ 数据到站后 `
        + `#lz-le 渲染（lzCalls='${lzCalls.join(',')}'）、textContent 序列按新数组序`);
      lzArr.push({ id: 'lx', name: 'LX' }, { id: 'ly', name: 'LY' });
      __arkui_dom_repeatUpdate(lzRep, lzArr);
      await tick(20);
      check(lzRep.dataset.repeatCount === '6' && !!root.querySelector('#lz-lx')
        && (root.querySelector('#lz-lx') || {}).textContent === 'lx@5'
        && !root.querySelector('#lz-ly'),
        `与 virtualScroll 裁剪共存：数据源 7 项 > totalCount=6 → 只渲染 6 项`
        + `（#lz-lx='#lx@5' 在、#lz-ly 不越裁剪，实际 repeatCount='${lzRep.dataset.repeatCount}'）`);

      // ── R156-A：onMoveThrough 拖拽进行中细粒度派发（独立第五个 Repeat 实例）──
      // 真机协议（list_item_drag_manager.cpp:645-663）：每个拖拽更新帧 from_live=GetIndex() →
      // to=ScaleNearItem（越过中线的邻居）→ to==from 直接 return（唯一守卫，无防抖）→
      // HandleSwapAnimation（MoveData 平移表：拖拽项移到 to、邻居腾位；弹簧只是视觉插值）→
      // FireOnMoveThrough(fromIndex_, to)：首参=拖拽起始索引（:198 赋值一次，全手势恒定）。
      // common.d.ts:25788 onMoveThrough?: OnMoveHandler（两参裸 number），经 onMove 第二参
      // ItemDragEventHandler 传入（common.d.ts:25838）——非独立链式属性。拖拽期间数据源不动。
      const mtArr = [{ id: 'mp', name: 'MP' }, { id: 'mq', name: 'MQ' },
        { id: 'mr', name: 'MR' }, { id: 'ms', name: 'MS' }];
      const mtRep = R.create(mtArr, null);
      const mtMoves = [];
      const mtThroughs = [];
      const mtRis = {};
      const mtThrough = (/** @type {number} */ from, /** @type {number} */ to) => {
        mtThroughs.push([from, to]);
      };
      R.each((ri) => {
        mtRis[ri.item.id] = ri;
        Column.create();
        Column.id('mt-' + ri.item.id);
        Text.create(ri.item.id + '@' + ri.index);
        Text.pop();
        Column.pop();
      });
      R.key((item) => item.id);
      R.onMove((/** @type {number} */ from, /** @type {number} */ to) => {
        mtMoves.push([from, to]);
      }, { onMoveThrough: mtThrough });
      R.pop();
      await tick(20);
      check(mtRep.dataset.onMoveThrough === 'registered'
        && (/** @type {any} */ (mtRep)).__repeat.onMoveThrough === mtThrough,
        `onMoveThrough 登记面：onMove 第二参 ItemDragEventHandler.onMoveThrough 存进 st（`
        + `dataset='${mtRep.dataset.onMoveThrough}'、__repeat.onMoveThrough 同引用）`);
      const mtOrder = () => Array.from(mtRep.children)
        .map((/** @type {any} */ c) => c.id.replace('mt-', '')).join('');
      const mtArrIds = () => mtArr.map((/** @type {any} */ x) => x.id).join('');

      const activeIdx = () => {
        let a = -1;
        dots.forEach((d, k) => { if (d.getAttribute('data-indic-active') === 'true') a = k; });
        return a;
      };
      check(activeIdx() === 1,
        `initialIndex(1) → 活动点 1（实际 ${activeIdx()}）`);
      const indW = /** @type {any} */ (ind).__indic;
      if (indW && indW.controller) indW.controller.showNext();
      await tick(20);          // onChange → @State → 重渲染走 microtask flush
      check(activeIdx() === 2 && txt('ind-log') === 'idx=2',
        `controller.showNext() → 点 2 且 onChange(2) 派发（日志 '${txt('ind-log')}'）`);
      if (indW && indW.controller) { indW.controller.changeIndex(0); indW.controller.showPrevious(); }
      check(activeIdx() === 0,
        `changeIndex(0) 后 showPrevious 在边界停住（loop=false 不回卷，实际 ${activeIdx()}）`);

      // ══════════ ⑤ ContainerReader（3 条） ══════════
      const cr = el('cr');
      check(!!cr && cr.dataset.widthBp === '2',
        `size.width=700 对 [320,600,840] → 桶 2（实际 '${cr && cr.dataset.widthBp}'）`);
      check(!!cr && cr.dataset.heightBp === '0' && cr.dataset.widthBp !== undefined,
        `未配置 height 阈值 → 透传 create 的 heightBreakpoint 缺省 0（实际 '${cr && cr.dataset.heightBp}'）`);
      check(!!cr && JSON.parse(cr.dataset.bpWidth || '[]').join(',') === '320,600,840',
        `breakpointConfig 阈值落 data-bp-width（实际 '${cr && cr.dataset.bpWidth}'）`);

      // ══════════ ⑥ Calendar（8 条） ══════════
      const cal = el('cal');
      const label = cal ? cal.querySelector('[data-cal-month]') : null;
      check(!!cal && label && label.textContent === '2026-09',
        `selected=2026-09-15 锚定 9 月（月标 '${label ? label.textContent : '<缺>'}'）`);
      const days = cal ? cal.querySelectorAll('[data-cal-day]') : [];
      check(days.length === 30,
        `2026-09 共 30 个日格（实际 ${days.length}）`);
      const d15 = cal ? cal.querySelector('[data-cal-day="15"]') : null;
      check(!!d15 && d15.getAttribute('data-selected') === 'true',
        `15 日选中（data-selected）`);
      // R94 修正：断言写死日期 = 脆弱断言（跨日必红）。'今天'语义源是 new Date()，
      // 断言同源动态计算（组件 data-today 标记仍强校验存在性）。
      const d = new Date();
      const todayExpect = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const todayCell = cal ? cal.querySelector('[data-cal-day][data-today="true"]') : null;
      // R151：显示月钉死 2026-09，而"今天"是动态的——跨月（如 10-01）时网格里不该有
      // data-today（负向断言同样是真语义：非当前月的日格不得误标今天）。
      const todayInMonth = todayExpect.indexOf('2026-09-') === 0;
      if (todayInMonth) {
        check(!!todayCell && todayCell.getAttribute('data-date') === todayExpect,
          `今天 ${todayExpect} 带 data-today（实际 '${todayCell && todayCell.getAttribute('data-date')}'）`);
      } else {
        check(!todayCell,
          `显示月 2026-09 不含今天（${todayExpect}）→ 日格无误标 data-today（R151 负向断言）`);
      }
      const w0 = cal ? cal.querySelector('[data-cal-week]') : null;
      check(!!w0 && w0.textContent === '一',
        `startOfWeek(1) → 周头从周一开始（实际 '${w0 ? w0.textContent : '<缺>'}'）`);
      const d6 = cal ? cal.querySelector('[data-cal-day="6"]') : null;
      check(!!d6 && d6.getAttribute('data-off-day') === 'true' && d6.style.color === 'rgb(198, 40, 40)',
        `offDays([0,6])：9/6 周日休息且 workStateStyle 生效（color='${d6 && d6.style.color}'）`);
      const d10 = cal ? cal.querySelector('[data-cal-day="10"]') : null;
      check(!!d10 && d10.getAttribute('data-mark') === '会',
        `currentData[{day:10,mark:'会'}] → 日 10 data-mark='会'（实际 '${d10 && d10.getAttribute('data-mark')}'）`);
      check(!!cal && cal.querySelector('[data-cal-prev]').style.display === 'none'
        && txt('cal-month-log') === 'month=2026-09' && txt('cal-sel-log') === 'sel=',
        `needSlide(false) 藏翻月钮；onRequestData 挂载回调 '2026-09'（'${txt('cal-month-log')}'）`);
      if (d15) {
        const d20 = cal.querySelector('[data-cal-day="20"]');
        d20.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        await tick(20);        // onSelectChange → @State → 重渲染走 microtask flush
        check(d20.getAttribute('data-selected') === 'true'
          && d15.getAttribute('data-selected') !== 'true'
          && txt('cal-sel-log') === 'sel=2026-9-20',
          `点选 20 日 → onSelectChange('2026-9-20') + 选中态迁移（'${txt('cal-sel-log')}'）`);
      } else {
        check(false, '点选 20 日：15 日格缺失，无法执行');
      }

      // ══════════ 重渲染健壮性（1 条）：@State 变更引发整页重放后，Repeat 复用不重建不重复 ══════════
      const repAfter = root.querySelector('[data-arkui-repeat]');
      check(repAfter === rep && repAfter.dataset.repeatCount === '4'
        && root.querySelectorAll('#rep-0').length === 1,
        `sel 变更重放后 Repeat 复用同一节点、仍 4 项且无重复（repeatCount='${repAfter && repAfter.dataset.repeatCount}'）`);

      // ══════════ 全局注册（1 条） ══════════
      check(['Calendar', 'ContainerReader', 'IndicatorComponent', 'MenuItemGroup', 'Repeat', 'WithTheme']
        .every((n) => typeof (/** @type {any} */ (globalThis))[n] !== 'undefined'),
        '6 个组件 + 控制器类都装上 global（页面自由变量引用可用）');
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';

  })();
  </script>
</body>
</html>
