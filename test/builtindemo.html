<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R125 内置手势（Swiper 拖拽翻页 / Tabs 滑动切换 / Scroll+List 拖拽滚动）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 360px; height: 480px; border: 1px solid #ccc; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R125：组件内置手势（真机参数：半页阈值 / 780vp/s / 边界摩擦 / 400ms）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/builtindemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    // R154：弹簧解算器收口等待的宿主分端窗——Electron 真实时钟（合成拖拽采样速度极大 +
    // offscreen 定时器节流）需长窗；浏览器虚拟时钟保持原 700 时序（页面调度稳定性）。
    // 分端断言先例：mediademo 时钟断言分端（R35 记档，R152-A 翻案合并）。
    const isElectron = /Electron/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);   // Android WebView（模拟器更慢）
    const settleMs = () => ((isElectron || isAndroid) ? 1200 : 700);
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');
    const group = async (name, fn) => {
      try { await fn(); } catch (e) {
        allPass = false;
        lines.push(`FAIL [${name}] 抛出异常：${e && e.stack ? String(e.stack).split('\n')[0] : e}`);
      }
    };
    // 合成指针事件（与 GestureDemo 同一套）；timeStamp 不可通过 EventInit 注入，
    // 速度类断言用可编程时钟（劫持 performance.now，同步派发也能造出 dt>0）
    const pev = (type, x, y, id, extra) => new PointerEvent(type, Object.assign({
      bubbles: true, cancelable: true, composed: true,
      clientX: x, clientY: y, pointerId: id || 1, pointerType: 'touch',
      isPrimary: (id || 1) === 1, button: 0, buttons: type === 'pointerup' ? 0 : 1,
    }, extra || {}));
    const down = (t, x, y, id) => t.dispatchEvent(pev('pointerdown', x, y, id));
    const move = (t, x, y, id) => t.dispatchEvent(pev('pointermove', x, y, id));
    const up = (t, x, y, id) => t.dispatchEvent(pev('pointerup', x, y, id));
    // 可编程时钟：test 只在受控段替换，用完还原
    let fakeNow = null;
    const realNow = performance.now.bind(performance);
    const clock = (on) => { performance.now = on ? (() => fakeNow || 0) : realNow; };
    /** 带时钟推进的拖拽：pts = [[dx 累计, dt(ms)]] 相对起点 */
    const dragClock = (t, x0, y0, pts, id) => {
      clock(true);
      fakeNow = 100;
      down(t, x0, y0, id);
      for (const [dx, dt] of pts) {
        fakeNow += dt;
        move(t, x0 + dx, y0 + (pts.dy || 0), id);
      }
      fakeNow += 10;
      up(t, x0 + pts[pts.length - 1][0], y0, id);
      clock(false);
    };

    try {
      __arkui_dom_requireModule('BuiltinDemo');
      __arkui_dom_loadRoute('pages/BuiltinDemo', root);
      await tick(80);
      check(!!el('sw') && !!el('tb') && !!el('scr') && !!el('lst'), 'BuiltinDemo 页面已渲染（sw/tb/scr/lst）');

      // ══════════ ① Swiper 初始态 + 跟手 ══════════
      const st = () => el('sw').__swiperState;
      const pageOf = (i) => st().entries[i].el;
      await group('Swiper 初始/跟手', async () => {
        check(st().entries.length === 3, `Swiper 3 页（实际 ${st().entries.length}）`);
        check(pageOf(0).style.display !== 'none' && pageOf(1).style.display === 'none',
          '初始 P0 可见 P1 隐藏（display 切换语义保持）');
        down(el('sw'), 80, 40);
        move(el('sw'), 74, 40);          // raw -6 → 越过 5px 启动阈值
        await tick(5);
        check(pageOf(0).style.transform.indexOf('translateX(-6') === 0,
          `拖拽跟手：P0 transform=translateX(-6px)（实际 '${pageOf(0).style.transform}'）`);
        check(pageOf(1).style.display === 'block' && pageOf(1).style.position === 'absolute',
          '邻页 P1 已上舞台（display:block + absolute）');
        up(el('sw'), 74, 40);
        const atRelease = pageOf(0).style.transform;
        await tick(80);
        const mid = pageOf(0).style.transform;
        check(atRelease !== '' && mid !== '' && mid !== atRelease,
          `回弹是欠阻尼弹簧（R126）：释放后 80ms 仍在动（'${atRelease}' → '${mid}'）`);
        await tick(settleMs());           // 弹簧收口（精度触发，非固定时长；R154 宿主分端窗）
        // 收口判定容忍恰落在零位的最后一帧：解算器精度触发后清 transform 与"末帧=0px"
        // 是竞态边界（第三跑实测 translateX(0px)）——语义上两者都是"回到静止"
        const settledTf = pageOf(0).style.transform;
        check(settledTf === '' || settledTf === 'translateX(0px)',
          `弹簧回弹收口后 transform 清空（实测 '${settledTf}'）`);
        check(pageOf(0).style.position === '' && pageOf(1).style.display === 'none',
          '拖拽舞台已还原（P0 回流、P1 影藏）');
      });

      // ══════════ ② 拖过半页翻页：A→C→E 顺序 + 显隐切换 ══════════
      await group('Swiper 过半页翻页', async () => {
        const before = txt('sp0').length;   // 只为触发读取；日志看 slog 状态
        const slogEl = root.querySelector('[data-arkui-comp="Swiper"]');
        // slog 在组件状态里，直接读 ObservedProperty 的 DOM 不可见——改读 __swiperState 旁证：
        // 用事件计数代替：翻页后 P1 可见即证 commit
        dragClock(el('sw'), 80, 40, [[-20, 30], [-95, 30], [-96, 5]], 7);   // 位移 -96 > 半页 80
        // 收口等待（原 tick(900) 定额在负载/虚拟时钟抖动下踩过"末帧未清"的竞态——
        // 第五跑实测）——轮询等舞台还原，上限 4s 兜底
        const settled = async () => {
          for (let i = 0; i < 80; i++) {
            const a = pageOf(0).style.transform, b = pageOf(1).style.transform;
            if ((a === '' || a === 'translateX(0px)') && (b === '' || b === 'translateX(0px)')) return true;
            await tick(50);
          }
          return false;
        };
        const didSettle = await settled();
        check(st().index === 1, `拖过半页（-96 > -80）→ 翻到 P1（实际 index=${st().index}）`);
        check(pageOf(1).style.display !== 'none' && pageOf(0).style.display === 'none',
          'commit 后 P1 可见 P0 隐藏');
        check(didSettle,
          '动画收口后 transform 清空（舞台还原；容忍恰零末帧 translateX(0px)）');
      });

      // ══════════ ③ 速度翻页（快扫小位移）+ 边界摩擦 ══════════
      await group('Swiper 速度翻页/边界摩擦', async () => {
        // 当前 index=1。快扫：10ms 内位移 -20 → v = -2000px/s < -780 → 翻页
        dragClock(el('sw'), 80, 40, [[-5, 5], [-25, 10]], 8);
        await tick(500);
        check(st().index === 2, `快扫 v≈-2000px/s → 速度翻页到 P2（实际 index=${st().index}）`);
        await tick(120);                  // 静置：等邻页收口 rAF 全部落地（避免覆写竞态）
        // P2（末页，loop=false）继续往左拖 = 朝界外 → 摩擦：显示偏移 < raw
        down(el('sw'), 80, 40);
        move(el('sw'), 70, 40);           // raw -10（朝界外，γ=10/360）
        await tick(5);
        const tf = pageOf(2).style.transform || '';
        const m = /translateX\((-?[\d.]+)px\)/.exec(tf);
        const shown = m ? Math.abs(Number(m[1])) : -1;
        check(m && shown > 0 && shown < 30,
          `边界摩擦：显示偏移 |${shown}| < 输入 30（f(γ)=0.72·fx/γ 原文）`);
        up(el('sw'), 70, 40);
        await tick(500);
        check(st().index === 2, '界外松手回弹：仍 P2');
        // 右拖（raw>0，sign=-1，nIdx=1）→ 正常回拖回 P1：过半页
        dragClock(el('sw'), 80, 40, [[20, 30], [95, 30], [96, 5]], 9);
        await tick(500);
        check(st().index === 1, `末页右拖过半 → 回 P1（实际 index=${st().index}）`);
      });

      // ══════════ ④ runtime 级：vertical / disableSwipe ══════════
      await group('Swiper vertical/disableSwipe', async () => {
        const VSP = globalThis.ViewStackProcessor;
        const snap = VSP ? VSP.snapshot() : null;
        const C = globalThis.Swiper;
        const node = C.create();
        C.vertical(true);
        C.loop(false);
        C.pop();
        if (VSP) VSP.restore(snap);
        node.style.width = '120px';
        node.style.height = '180px';
        root.appendChild(node);
        const vst = node.__swiperState;
        const mk = (t) => { const d = document.createElement('div'); d.textContent = t; d.style.height = '180px'; node.appendChild(d); return d; };
        mk('V0'); mk('V1');
        node.__swiperState && node.querySelectorAll('[data-arkui-swiper-page]').length;
        // 手动收口：直接调 finalize 路径不存在——entries 在 pop 时收集，但页在 pop 后追加；
        // 这里走 controller 前先补收集：pop 时 children 为空 → entries 空。补：追加后重收
        vst.entries = [...node.children].filter((c) => !c.hasAttribute('data-arkui-swiper-indicator'))
          .map((c) => { c.setAttribute('data-arkui-swiper-page', ''); return { el: c }; });
        vst.count = vst.entries.length;
        vst.entries.forEach((/** @type {any} */ e, /** @type {number} */ k) => { if (k) e.el.style.display = 'none'; });
        check(vst.vertical === true, `vertical(true) 进状态（实际 ${vst.vertical}）`);
        // 竖向拖：raw 以 clientY 计——往下拖 96 > 半页 90 → 应翻到 V1
        clock(true);
        fakeNow = 100;
        down(node, 60, 40);
        fakeNow += 30; move(node, 60, 30);
        fakeNow += 30; move(node, 60, -56);   // dy = -96
        fakeNow += 10; up(node, 60, -56);
        clock(false);
        await tick(500);
        check(vst.index === 1, `vertical 拖拽 -96 越半页（90）→ V1（实际 index=${vst.index}）`);
        // disableSwipe：拖了不动
        const snap2 = VSP ? VSP.snapshot() : null;
        const node2 = C.create();
        C.disableSwipe(true);
        C.pop();
        if (VSP) VSP.restore(snap2);
        node2.style.width = '120px';
        node2.style.height = '80px';
        root.appendChild(node2);
        const v2 = node2.__swiperState;
        const mk2 = (t) => { const d = document.createElement('div'); d.textContent = t; d.style.height = '80px'; node2.appendChild(d); return d; };
        mk2('D0'); mk2('D1');
        v2.entries = [...node2.children].map((c) => { c.setAttribute('data-arkui-swiper-page', ''); return { el: c }; });
        v2.count = v2.entries.length;
        v2.entries.forEach((/** @type {any} */ e, /** @type {number} */ k) => { if (k) e.el.style.display = 'none'; });
        down(node2, 60, 40);
        move(node2, 20, 40);
        up(node2, 20, 40);
        await tick(300);
        check(v2.index === 0 && v2.entries[0].el.style.transform === '',
          `disableSwipe(true) → 拖拽被忽略（index=${v2.index}）`);
      });

      // ══════════ ⑤ Tabs 内容区滑动翻页 ══════════
      await group('Tabs 滑动切换', async () => {
        const tst = el('tb').__tabsState;
        check(tst.scrollable === true, 'scrollable 默认 true（JSDoc 原文）');
        const content = el('tb').querySelector('[data-arkui-tabs-content]');
        dragClock(content, 80, 30, [[-20, 30], [-95, 30], [-96, 5]], 11);
        await tick(400);
        check(tst.index === 1, `内容区左拖过半 → Tab1（实际 index=${tst.index}）`);
        check(tst.contents[0].el.style.display === 'none' && tst.contents[1].el.style.display !== 'none',
          'Tab0 隐 Tab1 显');
        // scrollable(false) → 拖动不翻。属性分派走真实路径：把已挂载的 Tabs 临时推上栈
        const C = globalThis.Tabs;
        const VSP = globalThis.ViewStackProcessor;
        VSP.push(el('tb'));
        C.scrollable(false);
        VSP.pop();
        check(tst.scrollable === false, 'scrollable(false) 进状态');
        dragClock(content, 80, 30, [[-20, 30], [-95, 30]], 12);
        await tick(300);
        check(tst.index === 1, 'scrollable=false → 拖拽不再翻页');
      });

      // ══════════ ⑥ Scroll/List 拖拽滚动 + 惯性 ══════════
      await group('Scroll/List 拖拽滚动', async () => {
        const scr = el('scr');
        // 内容加高（fixture 内容 120/容器 90 只能滚 30px，不够惯性展开）
        const col = scr.firstElementChild;
        for (let i = 0; i < 6; i++) {
          const t = document.createElement('div');
          t.style.height = '40px';
          t.textContent = 'X' + i;
          col.appendChild(t);
        }
        // 向上拖（dy 负）→ scrollTop 增
        clock(true);
        fakeNow = 100;
        down(scr, 80, 70);
        fakeNow += 40; move(scr, 80, 50);
        fakeNow += 40; move(scr, 80, 10);    // dy = -60
        fakeNow += 10; up(scr, 80, 10);
        clock(false);
        const dragScrolled = scr.scrollTop;
        check(dragScrolled >= 55, `Scroll 拖拽滚动 60px（实际 scrollTop=${dragScrolled}）`);
        await tick(600);                      // 惯性衰减（rAF，虚拟时钟下快进）
        check(scr.scrollTop > dragScrolled,
          `惯性续走：${dragScrolled} → ${scr.scrollTop}`);
        // R126 越界冲激回弹：滚到底再向外 flick → 内容 translate 弹簧、收口清空
        scr.scrollTop = scr.scrollHeight;
        const scrContent = scr.firstElementChild;
        const maxScrolled = scr.scrollTop;
        down(scr, 80, 30);
        move(scr, 80, 10);                // 向上 flick = 朝底边外
        up(scr, 80, 10);
        await tick(60);
        const during = scrContent.style.transform || '';
        await tick(900);
        check(during.indexOf('translateY') === 0,
          `越界冲激：内容弹簧位移可见（'${during}'）`);
        check(scrContent.style.transform === '' && scr.scrollTop === maxScrolled,
          `越界弹簧收口清空、scrollTop 保持边界（${scr.scrollTop}/${maxScrolled}）`);
        const lst = el('lst');
        down(lst, 80, 70);
        move(lst, 80, 20);                    // dy=-50，List 内容 116-90=26px 可滚
        up(lst, 80, 20);
        await tick(300);
        check(lst.scrollTop > 0, `List 拖拽滚动（scrollTop=${lst.scrollTop}，上限 26）`);
        check(lst.scrollTop <= 27, 'List 滚动被内容高度正确钳制（+1 高 DPI 设备像素舍入余量，R149）');
      });

      // ══════════ ⑦ 拖拽释放曲线槽位（R154-B：Swiper.curve → api.finishCurve）══════════
      // 观察面说明（同 test/tabanim.html G10 先例）：虚拟时钟 headless（--dump-dom）不产帧，
      // rAF 回调不被调度——翻页过渡的落笔在 builtinFinishPagedDrag 的 rAF 里，本组要断言它，
      // 就把 rAF 重定向到 0ms 定时器（页面局部），让"舞台落笔"变成确定性的定时器序；
      // 收口通道（transitionend + dur+80 定时器兜底）不受影响。本组拖拽不用 dragClock
      //（不劫持 performance.now）——spring 解算器的 t0 取挂钟，劫持会让首拍 t 巨大、
      // 弹簧瞬间收口，"在途"就观察不到了。duration(120) 是给用例省虚拟时间预算的
      //（全页 --virtual-time-budget=8000，原 29 条已吃掉 ~6.6-7.0s）；spring 族照 d.ts
      // 不 respect duration，时长对它无效——这本身就是 ⑥ 号断言的一部分。
      window.requestAnimationFrame = (/** @type {Function} */ cb) => setTimeout(() => cb(performance.now()), 0);
      await group('Swiper curve 槽位', async () => {
        const C = globalThis.Swiper;
        const VSP = globalThis.ViewStackProcessor;
        const warns = globalThis.__arkui_dom_layout_warnings;
        const snap = VSP ? VSP.snapshot() : null;
        const node = C.create();
        C.loop(false);
        C.duration(120);
        C.pop();
        if (VSP) VSP.restore(snap);
        node.style.width = '360px';
        node.style.height = '120px';
        root.appendChild(node);
        const cst = node.__swiperState;
        const mk = (t) => { const d = document.createElement('div'); d.textContent = t; d.style.height = '120px'; node.appendChild(d); return d; };
        mk('C0'); mk('C1');
        cst.entries = [...node.children].filter((c) => !c.hasAttribute('data-arkui-swiper-indicator'))
          .map((c) => { c.setAttribute('data-arkui-swiper-page', ''); return { el: c }; });
        cst.count = cst.entries.length;
        cst.entries.forEach((/** @type {any} */ e, /** @type {number} */ k) => { if (k) e.el.style.display = 'none'; });
        const pg = () => cst.entries[0].el;
        // 缺省（未设 curve）：翻页过渡 = duration + ease-out（R125 契约，槽位空=向后兼容）
        down(node, 80, 30);
        move(node, 60, 30);                   // raw -20：越过 5px 启动阈值
        move(node, -260, 30);                 // raw -340 > 半页 180（大位移→弹簧行程短、收口快）
        up(node, -260, 30);
        await tick(30);
        check(pg().style.transition.replace(/ 0s/g, '') === 'transform 120ms ease-out',
          `缺省槽位：翻页过渡 ease-out（实际 '${pg().style.transition}'）`);
        await tick(240);
        // R154：Android WebView 的 transition 还原串行化 = 'none 0s ease 0s'（带全尾随段）——
        // 语义即 none，startsWith('none') 比较
        check(cst.index === 1 && pg().style.transition.indexOf('none') === 0,
          `ease-out 翻页收口（index=${cst.index}，transition 还原（实际 '${pg().style.transition}'）`);
        // curve(0 /* Curve.Linear */)：钩子可切换 → linear
        VSP.push(node);
        C.curve(0);
        VSP.pop();
        check(cst.curveKind === 'css' && cst.curveCss === 'linear',
          `curve(0) 进状态（${cst.curveKind}/${cst.curveCss}）`);
        down(node, 80, 30);
        move(node, 100, 30);                  // 右拖 raw +20
        move(node, 270, 30);                  // raw +190 > 180
        up(node, 270, 30);
        await tick(30);
        check(pg().style.transition.replace(/ 0s/g, '') === 'transform 120ms linear',
          `curve(0) 后翻页过渡切到 linear（实际 '${pg().style.transition}'）`);
        await tick(240);
        // curve('interpolatingSpring')：spring 族不 respect duration → R126 解算器直驱
        VSP.push(node);
        C.curve('interpolatingSpring');
        VSP.pop();
        check(cst.curveKind === 'spring', `curve('interpolatingSpring') → spring 族（${cst.curveKind}）`);
        down(node, 80, 30);
        move(node, 60, 30);
        move(node, -260, 30);
        up(node, -260, 30);
        await tick(40);
        // R154：Android 串行化 'none 0s ease 0s' 语义同 none（startsWith 比较）
        check(pg().style.transition.indexOf('none') === 0 && /translateX\(-[\d.]+px\)/.test(pg().style.transform || ''),
          `spring 族：解算器直驱无 CSS 过渡（transition '${pg().style.transition}'，transform '${pg().style.transform}' 在途）`);
        await tick(settleMs());  // R154：双因窗——①Electron 真实时钟下合成拖拽采样速度极大，
                                 //   弹簧振幅衰减到收敛阈需 ~600ms；②offscreen 对 setInterval
                                 //   有 ~1s 级节流（解算器首拍延迟）。浏览器虚拟时钟 700 即稳，
                                 //   1200 覆盖 Electron 两因（实测收敛）
        check(cst.index === 1 && pg().style.transform === '',
          `弹簧翻页收口（index=${cst.index}，transform 清空）`);
        // ICurve 对象读不出参数 → 告警 + 保持现值（与 Tabs.animationCurve 同口径）
        const warnBefore = warns.length;
        VSP.push(node);
        C.curve({ interpolate: () => 0 });
        VSP.pop();
        check(warns.length > warnBefore && warns[warns.length - 1].indexOf('Swiper.curve') >= 0
          && cst.curveKind === 'spring',
          `curve(ICurve) 记警告且保持现值（'${warns[warns.length - 1]}'）`);
      });

      // ══════════ ⑧ indicator 真语义（R154-B：DotIndicator / DigitIndicator）══════════
      await group('Swiper indicator 真语义', async () => {
        const C = globalThis.Swiper;
        const VSP = globalThis.ViewStackProcessor;
        const warns = globalThis.__arkui_dom_layout_warnings;
        const DI = globalThis.DotIndicator;
        const DG = globalThis.DigitIndicator;
        const freshSwiper = (/** @type {number} */ n, /** @type {any} */ ctl, /** @type {any=} */ setup) => {
          const snap = VSP ? VSP.snapshot() : null;
          const node = C.create(ctl);
          C.loop(false);
          if (setup) setup();
          for (let k = 0; k < n; k++) {
            const d = document.createElement('div');
            d.textContent = 'N' + k;
            d.style.height = '60px';
            node.appendChild(d);
          }
          C.pop();
          if (VSP) VSP.restore(snap);
          node.style.width = '240px';
          node.style.height = '60px';
          root.appendChild(node);
          return node;
        };
        // ① 显式 DotIndicator：圆点语义等价——不记退化/未实现警告，圆点数 = 页数
        const warn0 = warns.length;
        const dn = freshSwiper(3, null, () => C.indicator(new DI()));
        check(dn.querySelectorAll('[data-arkui-swiper-dot]').length === 3,
          'DotIndicator 显式圆点：圆点数 = 页数（3）');
        check(!warns.slice(warn0).some((w) => w.indexOf('DotIndicator') >= 0 || w.indexOf('退化') >= 0),
          'DotIndicator 显式圆点不记退化/未实现警告');
        // ② 颜色/尺寸配置生效 + 活动态（selectedColor/selectedItemWidth）
        const ctl2 = new globalThis.SwiperController();
        const dn2 = freshSwiper(3, ctl2, () => C.indicator(new DI().color('#ff0000').selectedColor('#00ff00')
          .itemWidth(10).itemHeight(10).selectedItemWidth(16).space(2)));
        const dots2 = [...dn2.querySelectorAll('[data-arkui-swiper-dot]')];
        check(dots2[1].style.background === 'rgb(255, 0, 0)' && dots2[1].style.width === '10px',
          `DotIndicator.color/itemWidth 生效（'${dots2[1].style.background}' '${dots2[1].style.width}'）`);
        check(dots2[0].style.background === 'rgb(0, 255, 0)' && dots2[0].style.width === '16px',
          `DotIndicator.selectedColor/selectedItemWidth 活动态生效（'${dots2[0].style.background}' '${dots2[0].style.width}'）`);
        ctl2.showNext();
        check(dots2[1].getAttribute('data-arkui-swiper-dot-active') === 'true'
          && dots2[1].style.background === 'rgb(0, 255, 0)' && dots2[1].style.width === '16px',
          '切页后选中态跟走（属性 + selected 几何/配色）');
        // ③ DigitIndicator：current/total 两段文本（current 从 1 起），随切换更新。
        //    配色语义：当前段=selectedFontColor/selectedDigitFont，非当前段（total/分隔）=
        //    fontColor/digitFont（selected* 命名语义）
        const ctl3 = new globalThis.SwiperController();
        const gn = freshSwiper(5, ctl3, () => C.indicator(new DG().fontColor('#123456').selectedFontColor('#654321')));
        const curEl = gn.querySelector('[data-arkui-swiper-digit="current"]');
        const totEl = gn.querySelector('[data-arkui-swiper-digit="total"]');
        check(!!curEl && !!totEl && curEl.textContent === '1' && totEl.textContent === '5',
          `DigitIndicator 初始 1/5 两段文本（'${curEl ? curEl.textContent : '<缺>'}/${totEl ? totEl.textContent : '<缺>'}'）`);
        check(!!curEl && curEl.style.color === 'rgb(101, 67, 33)' && totEl.style.color === 'rgb(18, 52, 86)',
          `selectedFontColor→当前段 '${curEl ? curEl.style.color : '<缺>'}' / fontColor→total 段 '${totEl ? totEl.style.color : '<缺>'}'`);
        ctl3.showNext();
        check(gn.querySelector('[data-arkui-swiper-indicator]').textContent === '2/5',
          `切页后文本随索引更新为 2/5（'${gn.querySelector('[data-arkui-swiper-indicator]').textContent}'）`);
        // ④ indicator(false) 摘除（重渲染同语义）；⑤ 非法入参告警
        VSP.push(gn);
        C.indicator(false);
        VSP.pop();
        check(!gn.querySelector('[data-arkui-swiper-indicator]'), 'indicator(false) 指示器摘除');
        const warn1 = warns.length;
        VSP.push(dn);
        C.indicator('yes');
        VSP.pop();
        check(warns.length > warn1 && warns[warns.length - 1].indexOf('Swiper.indicator') >= 0
          && !!dn.querySelector('[data-arkui-swiper-indicator]'),
          `非法入参记警告且指示器不受影响（'${warns[warns.length - 1]}'）`);
        // ⑥ DotIndicator 未达子集逐项记警告（mask/maxDisplayCount）
        const warn2 = warns.length;
        freshSwiper(3, null, () => C.indicator(new DI().mask(true).maxDisplayCount(9)));
        check(warns.slice(warn2).some((w) => w.indexOf('DotIndicator.mask') >= 0)
          && warns.slice(warn2).some((w) => w.indexOf('maxDisplayCount') >= 0),
          'DotIndicator.mask/maxDisplayCount（未达子集）逐项记警告');
      });

      lines.push(`BUILTIN sw=${st().index} tb=${el('tb').__tabsState.index} scr=${el('scr').scrollTop}`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';
  })();
  </script>
</body>
</html>
