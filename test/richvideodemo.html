<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R65：RichEditor + Video（contenteditable / video 垫片 / onReady）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 360px; }
  #root [data-arkui-comp="RichEditor"] { border: 1px solid #ddd; min-height: 40px; margin-bottom: 6px; padding: 4px; }
  #root [data-arkui-comp="Video"] { border: 1px solid #ddd; margin-bottom: 6px; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R65：RichEditor（contenteditable / onReady）+ Video（video 垫片 / controller）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/richvideodemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');

    try {
      __arkui_dom_requireModule('RichVideoDemo');
      __arkui_dom_loadRoute('pages/RichVideoDemo', root);
      await tick(120);
      const re = el('re');
      const vd = el('vd');

      // ══════════ ① RichEditor（3 条） ══════════
      check(!!re && re.getAttribute('contenteditable') === 'true',
        `RichEditor contenteditable 基座（实际 '${re && re.getAttribute('contenteditable')}'）`);
      check(re.dataset.placeholder === 'edit here',
        `placeholder('edit here') 记入 dataset（实际 '${re.dataset.placeholder}'）`);
      check(txt('rv-log').indexOf('RD') >= 0,
        `onReady 触发（log 含 RD；实际 '${txt('rv-log')}'）`);

      // ══════════ ② Video（3 条） ══════════
      const nativeVd = vd ? vd.querySelector('video') : null;
      check(!!vd && !!nativeVd,
        `Video 组件 + 原生 <video> 垫片`);
      check(vd.dataset.controls === 'false' && vd.dataset.autoPlay === 'false' && vd.dataset.muted === 'true',
        `controls=false autoPlay=false muted=true（实际 '${vd.dataset.controls}'/'${vd.dataset.autoPlay}'/'${vd.dataset.muted}'）`);
      check(nativeVd && nativeVd.muted === true,
        `原生 video muted 同步为 true（实际 ${nativeVd ? nativeVd.muted : 'N/A'}）`);

      lines.push(`LOG='${txt('rv-log')}'`);
      lines.push(`ELMT ${__arkui_dom_elmtRecords.size}`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';

  })();
  </script>
</body>
</html>
