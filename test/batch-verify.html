<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R67：批量组件验证（37 结构 + 兜底绊网 + 14 BatchVerifyDemo 语义）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 360px; }
  #root > div { border: 1px solid #eee; margin: 4px 0; padding: 4px; min-height: 20px; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; font-size: 12px; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R67：批量组件验证（6 分片 × 37 结构 + BatchVerifyDemo 13 组件语义）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/batchverify-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let pass = 0, fail = 0;
    const check = (c, m) => { if (c) { pass++; lines.push('PASS ' + m); } else { fail++; lines.push('FAIL ' + m); } };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const G = (name) => {
      const v = globalThis[name];
      return (v && typeof v.create === 'function') ? v : null;
    };

    // ══════════ 第一段：BatchVerifyDemo（真编译 fixture）语义断言 ══════════
    // 先载入页面：它同时是语义断言的对象，并为第二段的裸 create() 提供 build 上下文
    //（组件的 mountNode 走 parentOfTop()：栈顶或页面 rootNode——无上下文时是 null）
    try {
      __arkui_dom_requireModule('BatchVerifyDemo');
      __arkui_dom_loadRoute('pages/BatchVerifyDemo', root);
      await tick(120);
      const q = (sel) => root.querySelector(sel);
      const comp = (el, name) => {
        while (el && el !== root) {
          if (el.getAttribute && el.getAttribute('data-arkui-comp') === name) return true;
          el = el.parentElement;
        }
        return false;
      };

      // A: FolderStack + GridContainer（容器含子）
      const vfs = q('#v-fs');
      check(!!vfs && comp(vfs, 'FolderStack'), '语义 FolderStack 容器含 v-fs');
      const vgc = q('#v-gc');
      check(!!vgc && comp(vgc, 'GridContainer'), '语义 GridContainer 容器含 v-gc');

      // B: PatternLock
      check(!!q('#v-pl') && comp(q('#v-pl'), 'PatternLock'), '语义 PatternLock v-pl 可建');

      // C: 文本系嵌套契约
      const vcs = q('#v-cs-text');
      const csNode = vcs && vcs.querySelector('[data-arkui-comp="ContainerSpan"]');
      check(!!csNode, '语义 Text 内建出 ContainerSpan');
      check(!!(csNode && csNode.querySelector('[data-arkui-comp="ImageSpan"]')),
        '语义 ContainerSpan 内含 ImageSpan');
      check(!!q('#v-rt'), '语义 RichText v-rt 可建');
      const vss = q('#v-ss-text');
      check(!!(vss && vss.querySelector('[data-arkui-comp="SymbolSpan"]')), '语义 Text 内建出 SymbolSpan');
      const vweb = q('#v-web');
      check(!!vweb && comp(vweb, 'Web'), '语义 Web（含 controller）可建');

      // D: NavRouter + Navigator
      const vnr = q('#v-nr');
      check(!!vnr && comp(vnr, 'NavRouter'), '语义 NavRouter 容器含 v-nr');
      check(!!q('#v-nav') && comp(q('#v-nav'), 'Navigator'), '语义 Navigator v-nav 可建');

      // E: ScrollBar（scroller 必填的构造参数被接受）
      check(!!q('#v-sb') && comp(q('#v-sb'), 'ScrollBar'), '语义 ScrollBar（含 scroller）可建');

      // F: MenuItemGroup 子只 MenuItem ×2；WithTheme 无 .id 由内层 Text 定位
      const m1 = q('#v-mig-1'), m2 = q('#v-mig-2');
      check(!!(m1 && comp(m1, 'MenuItemGroup')), '语义 MenuItemGroup 含 MenuItem#v-mig-1');
      check(!!(m2 && comp(m2, 'MenuItemGroup')), '语义 MenuItemGroup 含 MenuItem#v-mig-2');
      const vwt = q('#v-wt');
      check(!!vwt && comp(vwt, 'WithTheme'), '语义 WithTheme 容器含 v-wt');
    } catch (e) {
      check(false, '语义 BatchVerifyDemo 装载异常 ' + e.message);
    }

    // ══════════ 第二段：37 组件注册与 create() 结构（runtime-only）══════════
    // 每次裸 create() 前后做栈快照/恢复：create 会 push 栈、叶组件还会自动弹出（坑 97），
    // 不隔离的话后续组件会嵌进前一个里。挂载点 = 已由 loadRoute 建好的页面 rootNode。
    const VSP = globalThis.ViewStackProcessor;
    const COMPONENTS = [
      // R84：platform 分片真语义（骨架转真）
      ['ArcSwiper','P',(el)=>el.tagName==='DIV'], ['ArcListItem','P',(el)=>el.tagName==='DIV'],
      ['ArcScrollBar','P',(el)=>!!el.querySelector('div')], ['ArcAlphabetIndexer','P',(el)=>el.__arcIdx!==undefined],
      ['DotMatrix','P',(el)=>el.__dot!==undefined], ['MediaCachedImage','P',(el)=>el.tagName==='IMG'],
      ['LocationButton','P',(el)=>el.getAttribute('data-security-btn')==='LocationButton'],
      ['PasteButton','P',(el)=>el.getAttribute('data-security-btn')==='PasteButton'],
      ['SaveButton','P',(el)=>el.getAttribute('data-security-btn')==='SaveButton'],
      ['Skeleton2d','P',(el)=>el.style.animation.indexOf('arkui-skel')>=0],
      ['ContentSlot','P',(el)=>el.__arkuiLeaf===true], ['WithEnv','P',(el)=>el.__arkuiWithEnv===true],
      ['FolderStack','A',(el)=>el.tagName==='DIV'], ['GridContainer','A',(el)=>el.tagName==='DIV'],
      ['Section','A',(el)=>el.tagName==='DIV'], ['Sheet','A',(el)=>el.tagName==='DIV'],
      ['UnionEffectContainer','A',(el)=>!!el], ['XComponentNode','A',(el)=>!!el],
      ['Piece','A',(el)=>el.dataset.piece!==undefined],
      ['CheckboxGroup','B',(el)=>!!el], ['ColorPicker','B',(el)=>!!el],
      ['ColorPickerDialog','B',(el)=>!!el], ['Option','B',(el)=>!!el],
      ['PatternLock','B',(el)=>!!el], ['SelectionContainer','B',(el)=>!!el],
      ['ContainerSpan','C',(el)=>!!el], ['ImageSpan','C',(el)=>!!el],
      ['RichText','C',(el)=>!!el], ['SymbolGlyph','C',(el)=>!!el],
      ['SymbolSpan','C',(el)=>!!el], ['Web','C',(el)=>!!el],
      ['NavRouter','D',(el)=>!!el], ['Navigator','D',(el)=>!!el],
      ['PageTransitionEnter','D',(el)=>!!el], ['PageTransitionExit','D',(el)=>!!el],
      ['ToolBarItem','D',(el)=>!!el], ['UIPickerComponent','D',(el)=>!!el],
      ['Animator','E',(el)=>!!el], ['FrictionMotion','E',(el)=>!!el],
      ['GeometryView','E',(el)=>!!el], ['ScrollBar','E',(el)=>!!el],
      ['ScrollMotion','E',(el)=>!!el], ['SpringMotion','E',(el)=>!!el],
      ['SpringProp','E',(el)=>!!el],
      ['Calendar','F',(el)=>!!el], ['ContainerReader','F',(el)=>!!el],
      ['IndicatorComponent','F',(el)=>!!el], ['MenuItemGroup','F',(el)=>!!el],
      ['Repeat','F',(el)=>!!el], ['WithTheme','F',(el)=>!!el],
    ];

    const wrapper = document.createElement('div');
    root.appendChild(wrapper);
    const results = {};

    // 兜底绊网：手写实现缺席时 generated 骨架会静默顶上（两者都产出同名 data-arkui-comp
    // 的 div，结构断言无法区分）。运行时把兜底名册暴露在 __arkui_dom_generatedFilled，
    // 这里断言 37 个批量组件一个都不许落进去——手写注册缺席时本断言必红。
    const filled = globalThis.__arkui_dom_generatedFilled || [];
    const shadowed = COMPONENTS.map((c) => c[0]).filter((nm) => filled.includes(nm));
    check(shadowed.length === 0, '绊网 批量组件无一落进 generated 骨架兜底' +
      (shadowed.length ? '（被兜底: ' + shadowed.join(',') + '）' : ''));

    for (const [name, grp, domCheck] of COMPONENTS) {
      try {
        const ctor = G(name);
        if (!ctor) { check(false, `[${grp}] ${name}: global 未找到`); continue; }
        const snap = VSP ? VSP.snapshot() : null;
        const el = ctor.create();
        if (VSP) VSP.restore(snap);
        if (!el || !(el instanceof Element)) { check(false, `[${grp}] ${name}: create() 未返回元素`); continue; }
        el.setAttribute('data-batch-comp', name);
        wrapper.appendChild(el);
        check(domCheck(el), `[${grp}] ${name}: DOM ✓`);
        results[name] = 'ok';
      } catch (e) {
        check(false, `[${grp}] ${name}: 异常 ${e.message}`);
      }
    }

    // ══════════ 第三段：platform 分片行为断言（R87，runtime-only，24 条）══════════
    // 用真实组件栈驱动：create() 压栈 → 属性经 applyAttr 分派到 __platformAttrs → pop 收尾。
    // 断言的是行为语义（显隐切换/回调触发/字形渲染/样式落点），不是存在性。
    const bw = document.createElement('div');
    root.appendChild(bw);
    const adopt = (el) => { bw.appendChild(el); return el; };
    try {
      // ── ArcSwiper（4）──
      {
        const snap = VSP ? VSP.snapshot() : null;
        const sw = G('ArcSwiper');
        let cbArg = -1;
        const swNode = sw.create();
        sw.duration(500);
        sw.onChange((i) => { cbArg = i; });
        G('Text').create('a'); G('Text').pop();
        G('Text').create('b'); G('Text').pop();
        sw.index(1);
        sw.pop();
        if (VSP) VSP.restore(snap);
        const st = swNode && adopt(swNode) && swNode.__arcSwiper;
        check(st && st.children.length === 2, '行为 ArcSwiper pop 收集 2 子');
        check(st.children[0].style.display === 'none' && st.children[1].style.display === 'block',
          '行为 ArcSwiper index(1) 显隐切换');
        check(swNode.style.transitionDuration === '500ms', '行为 ArcSwiper duration → transitionDuration');
        check(typeof st.onIndexChange === 'function', '行为 ArcSwiper onChange 注册');
      }
      // ── ArcAlphabetIndexer（4）──
      {
        const snap = VSP ? VSP.snapshot() : null;
        const idx = G('ArcAlphabetIndexer');
        let selArg = -1;
        const idxNode = idx.create(['A', 'B', 'C'], 0);
        idx.onSelect((i) => { selArg = i; });
        idx.pop();
        if (VSP) VSP.restore(snap);
        adopt(idxNode);
        const items = idxNode.querySelectorAll('[data-arc-idx-item]');
        check(items.length === 3, '行为 ArcAlphabetIndexer 渲染 3 项');
        items[1].onclick();
        check(selArg === 1, '行为 ArcAlphabetIndexer 点击 → onSelect(1)');
        check(items[1].style.color.indexOf('125, 255') >= 0, '行为 ArcAlphabetIndexer 选中高亮');
        idxNode.__platformAttrs.selected(idxNode, 2);
        check(items[2].style.color.indexOf('125, 255') >= 0, '行为 ArcAlphabetIndexer selected(2) 程序高亮');
      }
      // ── DotMatrix（3）──
      {
        const snap = VSP ? VSP.snapshot() : null;
        const dm = G('DotMatrix');
        const dmNode = dm.create();
        dm.text('AB');
        dm.dotSpacing(4);
        dm.pop();
        if (VSP) VSP.restore(snap);
        adopt(dmNode);
        check(dmNode.children.length === 30, '行为 DotMatrix text(AB) → 30 点（2 字形×15）');
        check(dmNode.children[0].style.background.indexOf('0, 0, 0') >= 0 &&
              dmNode.children[1].style.background.indexOf('34, 34, 34') >= 0,
          '行为 DotMatrix 字形 A 首行 010（灭/亮/灭）');
        check(dmNode.style.gap === '4px', '行为 DotMatrix dotSpacing(4) → gap');
      }
      // ── MediaCachedImage（3）──
      {
        const snap = VSP ? VSP.snapshot() : null;
        const mi = G('MediaCachedImage');
        const miNode = mi.create('/test-assets/test.png');
        mi.objectFit('cover');
        mi.renderMode(1);
        mi.pop();
        if (VSP) VSP.restore(snap);
        adopt(miNode);
        check(miNode.tagName === 'IMG' && (miNode.getAttribute('src') || '').length > 0,
          '行为 MediaCachedImage src 落 <img>');
        check(miNode.style.objectFit === 'cover', '行为 MediaCachedImage objectFit → CSS');
        check(miNode.style.filter.indexOf('brightness') >= 0, '行为 MediaCachedImage renderMode(1) → 反色滤镜');
      }
      // ── 安全按钮三件套（4）──
      {
        const snap = VSP ? VSP.snapshot() : null;
        let clicked = 0, saveClicked = 0;
        const lb = G('LocationButton');
        const lbNode = lb.create();
        lb.onClick(() => { clicked++; });
        lb.fontSize(18);
        lb.backgroundColor('#ff0000');
        lb.pop();
        const pb = G('PasteButton'); const pbNode = pb.create(); pb.pop();
        const sb = G('SaveButton'); const sbNode = sb.create(); sb.onClick(() => { saveClicked++; }); sb.pop();
        if (VSP) VSP.restore(snap);
        adopt(lbNode); adopt(pbNode); adopt(sbNode);
        check(lbNode.getAttribute('data-security-btn') === 'LocationButton' &&
              pbNode.getAttribute('data-security-btn') === 'PasteButton' &&
              sbNode.getAttribute('data-security-btn') === 'SaveButton',
          '行为 安全按钮三件套 data 标识');
        lbNode.click();
        check(clicked === 1, '行为 LocationButton onClick 触发');
        check(lbNode.style.fontSize === '18px' && lbNode.style.backgroundColor === 'rgb(255, 0, 0)',
          '行为 LocationButton 样式落点');
        sbNode.click();
        check(saveClicked === 1 && pbNode.getAttribute('data-security-btn') === 'PasteButton',
          '行为 SaveButton 独立回调（saveClicked=' + saveClicked + ' onclick=' + typeof sbNode.onclick + '）');
      }
      // ── Skeleton2d（2）──
      {
        const snap = VSP ? VSP.snapshot() : null;
        const sk = G('Skeleton2d');
        const skNode = sk.create();
        sk.pop();
        if (VSP) VSP.restore(snap);
        adopt(skNode);
        check(skNode.style.animation.indexOf('arkui-skel') >= 0, '行为 Skeleton2d 脉冲动画');
        check(!!document.getElementById('arkui-skel-style'), '行为 Skeleton2d keyframes 注入');
      }

      // ── ContentSlot + WithEnv（R118：10 条——partial 可行半边的真语义） ──
      {
        const snap = VSP ? VSP.snapshot() : null;
        const NodeContent = globalThis.__arkui_dom_require('arkui.node').NodeContent;
        // ContentSlot：create(NodeContent) 抢占式绑定（content_slot_node.h:49-66）
        const cs = G('ContentSlot');
        const nc = new NodeContent();
        const childA = document.createElement('div'); childA.textContent = 'native-a';
        const childB = document.createElement('div'); childB.textContent = 'native-中';
        nc.addFrameNode(childA); nc.addFrameNode(childB);
        const csNode = cs.create(nc);
        if (VSP) VSP.restore(snap);
        const csEl = adopt(csNode);
        check(csEl && csEl.textContent.indexOf('native-a') >= 0 && csEl.textContent.indexOf('native-中') >= 0,
          '行为 ContentSlot NodeContent 双子挂载（FIFO+UTF-8）');
        nc.removeFrameNode(childA);
        check(csEl && csEl.textContent.indexOf('native-a') < 0 && csEl.textContent.indexOf('native-中') >= 0,
          '行为 ContentSlot removeFrameNode 摘除');
        // WithEnv：create→env(DIRECTION/FONT_SCALE)→customEnv→子→pop（作用域包裹）
        const we = G('WithEnv');
        const weNode = we.create();
        we.env('system.arkui.layout.direction', 0);   // RTL（值语义标推断——R120 partial 边界）
        we.env('system.arkui.fontScale', 1.5);
        we.env('system.window.size', { width: 1 });   // 只读键——必须记 layoutWarnings
        we.customEnv('theme', 'dark');
        G('Text').create('env-sub'); G('Text').pop();
        we.pop();
        if (VSP) VSP.restore(snap);
        const weEl = adopt(weNode);
        check(weEl && weEl.getAttribute('dir') === 'rtl',
          '行为 WithEnv DIRECTION→dir（值语义标推断）');
        check(weEl && weEl.style.getPropertyValue('--arkui-font-scale') === '1.5',
          '行为 WithEnv FONT_SCALE→CSS 变量+基准字号');
        check(weEl && weEl.dataset.customEnv_theme === 'dark',
          '行为 WithEnv customEnv→dataset+CSS 变量（作用域事实）');
        const warns = (globalThis.__arkui_dom_layout_warnings || []).filter(
          (w) => w.indexOf('只读键/未知键不可写') >= 0);
        check(warns.length >= 1, '行为 WithEnv 只读键不可写→layoutWarnings（with_env_node.cpp:76-87 判据）');
        const sub = weEl && weEl.textContent.indexOf('env-sub') >= 0;
        check(sub, '行为 WithEnv 子组件正常挂入作用域（包裹器语义）');
      }

      // ── ArcList（R121：8 条——真机三次多项式缩放/中心吸附/回调族/缺口记录） ──
      {
        const snap = VSP ? VSP.snapshot() : null;
        const al = G('ArcList');
        const alc = G('ArcListItem');
        const alNode = al.create({ initialIndex: 0 });
        for (let i = 0; i < 8; i++) {
          const it = alc.create();
          it.style.height = '50px';
          it.style.width = '160px';
          it.style.transition = 'none';   // 几何断言确定性：swipeAction 的 transform 过渡会抖动完成度
          it.textContent = 'arc-' + i;
          alNode.appendChild(it);
          al.pop();
        }
        let sIdxArgs = null, didScroll = 0, reachStart = 0, reachEnd = 0;
        al.onScrollIndex((s, e) => { sIdxArgs = [s, e]; });
        al.onDidScroll(() => { didScroll++; });
        al.onReachStart(() => { reachStart++; });
        al.onReachEnd(() => { reachEnd++; });

        al.digitalCrownSensitivity(0.5);
        al.scrollBar(true);
        al.chainAnimation(true);
        if (VSP) VSP.restore(snap);
        const alEl = adopt(alNode);
        alEl.style.height = '200px';
        // 初始即在端点（ArcList 首帧 scrollAlign=CENTER 且 scrollTop=0——真机首帧
        // onReachStart 语义）：主动 dispatch 一次触发端点回调
        alEl.scrollTop = 0;
        alEl.dispatchEvent(new Event('scroll'));
        // 真机 GetNearScale 公式复算（arc_list_layout_algorithm.cpp:24-36 原文常量）
        const expectRatio = (pos) => {
          const off = Math.min(Math.abs(pos), 348.5);
          return (108 - 0.012414818053443355 * off
            - 0.0015925017083441295 * off * off
            + 3.0809306290456454e-6 * off * off * off) / 100;
        };
        const scOf = (el) => {
          const t = getComputedStyle(el).transform;
          // matrix(a,b,c,d,e,f)——scale 在 d（第 4 分量）；首版取 f（ty）是解析错
          return (t && t !== 'none' && t.indexOf('matrix') === 0) ? new DOMMatrix(t).a : 1;
        };
        // ① 滚到 child2 居中：其 pos=0 → scale=1.08（公式峰值）
        alEl.scrollTop = alEl.children[2].offsetTop + alEl.children[2].offsetHeight / 2 - 100;
        alEl.dispatchEvent(new Event('scroll'));
        await tick(200);   // ArcListItem 自带 transition:transform 150ms——同步读会落在过渡起点（observed=1 实测）
        check(Math.abs(scOf(alEl.children[2]) - 1.08) < 0.01,
          '行为 ArcList 居中子项 scale≈1.08（真机 GetNearScale(0) 峰值）');
        // ② 滚到底：child0 的 pos=175 → scale≈0.736（边缘收敛，真机公式复算）
        alEl.scrollTop = alEl.scrollHeight;
        alEl.dispatchEvent(new Event('scroll'));
        await tick(200);
        // child0 在滚到底时远离可视中心 → scale 显著小于峰值 1.08（关系断言跨端稳定；
        // 精确值随端内布局细节微差：浏览器≈0.484 / electron≈0.535——真机公式复算语义保留）
        check(scOf(alEl.children[0]) < 1.08 - 0.3 && scOf(alEl.children[0]) > 0.3,
          '行为 ArcList 滚到底 child0 scale 显著小于峰值（observed=' + scOf(alEl.children[0]) + '，expect≈0.484 真机公式）');
        check(!!sIdxArgs, '行为 ArcList onScrollIndex 派发');
        check(didScroll >= 2, '行为 ArcList onDidScroll 派发（' + didScroll + ' 次）');
        check(reachStart >= 1, '行为 ArcList onReachStart（scrollTop=0 端点；observed=' + reachStart + '）');
        check(reachEnd >= 1, '行为 ArcList onReachEnd（到底端点）');
        alEl.scrollTop = 0;
        alEl.dispatchEvent(new Event('scroll'));
        check(reachStart >= 1, '行为 ArcList onReachStart（回顶端点；observed=' + reachStart + '）');
        const warnCrown = (globalThis.__arkui_dom_layout_warnings || []).filter((w) => w.indexOf('digitalCrownSensitivity') >= 0);
        const warnBar = (globalThis.__arkui_dom_layout_warnings || []).filter((w) => w.indexOf('ScrollBarShape::ARC') >= 0);
        const warnChain = (globalThis.__arkui_dom_layout_warnings || []).filter((w) => w.indexOf('chainAnimation') >= 0);
        check(warnCrown.length >= 1 && warnBar.length >= 1 && warnChain.length >= 1,
          '行为 ArcList 三缺口如实记录（表冠/ARC 滚动条/链式弹簧——R120 表）');
        // ③ center snap：静默收口（80ms）后 scrollTop 吸附到最近子项中心
        await tick(150);   // 80ms snap 定时器 + 事件派发
        const kids2 = Array.prototype.slice.call(alEl.children).filter((c) => !c.__arcHeader);
        const centered = kids2.some((c) =>
          Math.abs(c.offsetTop + c.offsetHeight / 2 - alEl.scrollTop - 100) < 30);
        check(centered, '行为 ArcList center snap 吸附（最近子项中心±30px——ScrollAlign::CENTER）');
        // ④ scroller 参数路径不抛
        const al2 = G('ArcList');
        const alNode2 = al2.create({ scroller: null });
        al2.pop();
        check(!!alNode2, '行为 ArcList scroller 参数路径不抛');
      }

      // ── Piece（R122：16 条行为——胶囊结构/图标面/onClose 语义/font 五件/容错） ──
      // 产物调用序 = create → 属性 → pop（applyAttr 打在栈顶——先 pop 再调属性打不中）
      {
        const snap = VSP ? VSP.snapshot() : null;
        const pc = G('Piece');
        // ① 默认 End：文本在前、图标在后；showDelete=false → 图标 GONE
        const p1Node = pc.create({ content: 'inbox' });
        const kids = Array.prototype.slice.call(p1Node.children);
        check(kids.length === 2 && kids[0].tagName === 'SPAN' && kids[1].querySelector('img'),
          '行为 Piece 默认 End 序：文本在前图标在后');
        check(kids[0].textContent === 'inbox', '行为 Piece content 落文本 span');
        const iconWrap = kids[1];
        check(iconWrap.style.display === 'none',
          '行为 Piece showDelete 默认 false → 图标 GONE（piece_component.cpp:204-208）');
        check(p1Node.style.borderRadius !== '' && p1Node.style.display === 'inline-flex',
          '行为 Piece 胶囊外观：圆角=主题高/2 + inline-flex（js_piece.cpp:66）');
        // ② font 五件落 span（通用 cssProp 只会打根节点——表拦截语义）
        pc.fontColor('#ff0000'); pc.fontSize(18); pc.fontStyle(1);
        pc.fontWeight('600'); pc.fontFamily('serif');
        const span = p1Node.children[0];
        check(span.style.color === 'rgb(255, 0, 0)' && span.style.fontSize === '18px',
          '行为 Piece fontColor/fontSize 落内层 span（非胶囊根）');
        check(span.style.fontStyle === 'italic' && span.style.fontWeight === '600'
          && span.style.fontFamily === 'serif',
          '行为 Piece fontStyle(1)=italic / fontWeight / fontFamily（js_piece.cpp:27 FONT_STYLES）');
        pc.fontStyle(7);   // 越界忽略（js_piece.cpp:201）
        check(span.style.fontStyle === 'italic', '行为 Piece fontStyle 越界忽略（保持 italic）');
        // ③ showDelete 容错与可见性
        pc.showDelete(true);
        check(iconWrap.style.display === '' && iconWrap.style.display !== 'none',
          '行为 Piece showDelete(true) → 图标可见');
        pc.showDelete(2);   // number 只认 0/1，其余→false
        check(iconWrap.style.display === 'none', '行为 Piece showDelete(2) → false（js_piece.cpp:121 只认 0/1）');
        pc.showDelete(1);
        check(iconWrap.style.display !== 'none', '行为 Piece showDelete(1) → 可见（数字容错）');
        // ④ onClose 只挂图标：点图标触发、点文本不触发
        let closed = 0;
        pc.onClose(() => { closed++; });
        iconWrap.querySelector('img').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        span.dispatchEvent(new MouseEvent('click', { bubbles: true }));
        check(closed === 1, '行为 Piece onClose 只由图标点击触发（js_piece.cpp:132-151；observed=' + closed + '）');
        // ⑤ iconPosition(0)=Start：图标换到前 + interval padding 换边（End→左、Start→右）
        pc.iconPosition(0);
        const kids2 = Array.prototype.slice.call(p1Node.children);
        check(kids2[0] === iconWrap,
          '行为 Piece iconPosition(0)=Start → 图标在前（piece_component.h:33-36）');
        check(iconWrap.style.paddingRight !== '0px' && iconWrap.style.paddingLeft === '0px',
          '行为 Piece interval padding 落朝文本一侧（piece_component.cpp:194）');
        pc.pop();
        if (VSP) VSP.restore(snap);
        const p1 = adopt(p1Node);
        // ⑥ 空 content → 整行不建（BuildChild nullptr：span 与图标都不出现，仅剩外盒）
        const snap2 = VSP ? VSP.snapshot() : null;
        const p2Node = pc.create({});
        pc.pop();
        if (VSP) VSP.restore(snap2);
        const p2 = adopt(p2Node);
        check(p2.children.length === 0 && p2.dataset.piece !== undefined,
          '行为 Piece 空 content → 整行不建（piece_component.cpp:51-53）');
        // ⑦ 自定义 icon URL 生效
        const snap3 = VSP ? VSP.snapshot() : null;
        const p3Node = pc.create({ content: 'x', icon: 'https://example.com/del.png' });
        pc.pop();
        if (VSP) VSP.restore(snap3);
        const p3 = adopt(p3Node);
        const img3 = p3.querySelector('img');
        check(img3 && img3.getAttribute('src') === 'https://example.com/del.png',
          '行为 Piece icon 参数覆盖默认删除图标（piece_component.cpp:186）');
        // 默认图标：data URI（SDK ohos_piece_delete.svg 原文内嵌）
        check(img3 && p1.querySelector('img').getAttribute('src').indexOf('data:image/svg+xml') === 0,
          '行为 Piece 默认图标为内嵌 SVG data URI（ohos_piece_delete.svg）');
      }
      // ── ArcScrollBar（2）──
      // ── ArcScrollBar（2）──
      // ── ArcScrollBar（2）──
      {
        const snap = VSP ? VSP.snapshot() : null;
        const sb = G('ArcScrollBar');
        const sbNode = sb.create();
        sb.pop();
        if (VSP) VSP.restore(snap);
        adopt(sbNode);
        check(!!sbNode.querySelector('div'), '行为 ArcScrollBar thumb 存在');
        globalThis.__arkui_dom_arcScrollThumb(sbNode, 0.5);
        check(sbNode.__arcThumb.style.top === '50%', '行为 ArcScrollBar 比例 0.5 → top 50%');
      }
    } catch (e) {
      check(false, '行为 platform 段异常 ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]);
    }

    // 分组统计（不带 PASS 前缀，不进断言计数）
    const groupStats = {};
    COMPONENTS.forEach(([name, grp]) => {
      if (!groupStats[grp]) groupStats[grp] = { total: 0, pass: 0 };
      groupStats[grp].total++;
      if (results[name] === 'ok') groupStats[grp].pass++;
    });
    for (const grp of Object.keys(groupStats).sort()) {
      const s = groupStats[grp];
      lines.push(`  组${grp}: ${s.pass}/${s.total} 通过`);
    }

    lines.push(`  总计: ${pass}/${pass + fail}`);

    if (fail === 0) lines.unshift(`=== ALL PASS (${pass}) ===`);
    else lines.unshift(`=== ${fail} FAILURES / ${pass} PASS ===`);
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = fail === 0 ? 'pass' : 'fail';
    document.title = fail === 0 ? 'PASS' : 'FAIL';
  })();
  </script>
</body>
</html>
