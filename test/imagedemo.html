<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R45：Image 组件（真实 <img> 基座 + objectFit + alt + 加载回调）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 360px; }
  #root [data-arkui-comp] { border: 1px solid #ddd; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R45：Image（objectFit 对照 / alt 占位 / onError·onComplete 载荷）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/imagedemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');
    const group = async (name, fn) => {
      try { await fn(); } catch (e) {
        allPass = false;
        lines.push(`FAIL [${name}] 抛出异常：${e && e.stack ? String(e.stack).split('\n')[0] : e}`);
      }
    };

    try {
      __arkui_dom_requireModule('ImageDemo');
      __arkui_dom_loadRoute('pages/ImageDemo', root);
      // 图片加载是异步的：轮询到 log 出现 C13x5（onComplete 载荷）再断言
      let loaded = false;
      for (let k = 0; k < 60 && !loaded; k++) {
        loaded = txt('im-log').includes('C13x5;');
        if (!loaded) await tick(50);
      }
      await tick(60);
      check(!!el('im1') && !!el('im4'), 'ImageDemo 页面已渲染（4 个 Image + log）');

      // ══════════ ① 基座与 objectFit：div 包装 + 主 img + CSS object-fit ══════════
      await group('基座与 objectFit', async () => {
        const main1 = el('im1') && el('im1').querySelector('[data-arkui-img-main]');
        const main2 = el('im2') && el('im2').querySelector('[data-arkui-img-main]');
        check(!!el('im1') && el('im1').tagName === 'DIV' && !!main1 && main1.tagName === 'IMG',
          '组件根 = div 包装 + 主 <img>（真机 alt 需要分层，见 ③）');
        check((main1.src || '').endsWith('test-assets/known-7x3.png'),
          `create(src) → 主 img.src（'${(main1.src || '').split('/').pop()}'）`);
        check(main1.style.objectFit === 'contain',
          `objectFit(Contain=0) → object-fit:contain（实际 '${main1.style.objectFit}'）`);
        check(main2.style.objectFit === 'cover',
          `objectFit(Cover=1) → object-fit:cover（实际 '${main2.style.objectFit}'）`);
        check(el('im1').dataset.objectFit === '0' && el('im2').dataset.objectFit === '1',
          `枚举数值记录 data-object-fit（'${el('im1').dataset.objectFit}'/'${el('im2').dataset.objectFit}'，自由变量求值正确）`);
        check(el('im1').style.width === '120px' && el('im1').style.height === '60px',
          'width/height 落包装（基座通用属性）');
      });

      // ══════════ ② alt 占位 + onError：404 图 ══════════
      await group('alt 与 onError', async () => {
        const im3 = el('im3');
        const main3 = im3.querySelector('[data-arkui-img-main]');
        const alt3 = im3.querySelector('[data-arkui-img-alt]');
        check((alt3.src || '').endsWith('known-1x1.png'), `alt 图已挂（'${(alt3.src || '').split('/').pop()}'）`);
        check(alt3.style.display === 'block',
          `主图失败 → alt 占位顶上（display='${alt3.style.display}'）`);
        check(main3.complete && main3.naturalWidth === 0, '主图确认加载失败（404）');
        check(txt('im-log').includes('ERR;'), `onError 派发（log='${txt('im-log')}'）`);
      });

      // ══════════ ③ onComplete 载荷：真实解码尺寸 ══════════
      await group('onComplete 载荷', async () => {
        check(txt('im-log').includes('C13x5;'),
          `known-13x5.png 解码尺寸进载荷（log='${txt('im-log')}'，known-13x5=13×5）`);
        const main4 = el('im4').querySelector('[data-arkui-img-main]');
        check(main4.complete && main4.naturalWidth === 13 && main4.naturalHeight === 5,
          `主图真实解码 ${main4.naturalWidth}×${main4.naturalHeight}（期望 13×5）`);
      });

      // ══════════ ④ syncLoad 记录 + 回归 ══════════
      await group('记录与回归', async () => {
        check(el('im4').dataset.syncLoad === 'true', `syncLoad 记 data-*（'${el('im4').dataset.syncLoad}'）`);
        const bad = __arkui_dom_layout_warnings.filter((w) => /Image\./.test(String(w)));
        check(bad.length === 0, `Image 属性不记"未实现"警告（剩 ${bad.length} 条：${bad.slice(0, 2).join('|')}）`);
      });

      lines.push(`LOG='${txt('im-log')}'`);
      lines.push(`ELMT ${__arkui_dom_elmtRecords.size}`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';
  })();
  </script>
</body>
</html>
