<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R66/R147：批量输入（CheckboxGroup / PatternLock；SelectionContainer/ColorPicker/Option 四族不在 CLT 26 SDK 已裁——runtime 语义层仍在 batch-input.js，见 batchverify）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 360px; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
  [data-pl-dot] { border: 2px solid #b3b7bb; border-radius: 50%; position: absolute; box-sizing: border-box; }
</style>
</head>
<body>
  <h3>R66/R147：批量输入（CheckboxGroup / PatternLock）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/batchinputdemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');
    const firePointer = (target, type, x, y) => target.dispatchEvent(new PointerEvent(type, {
      bubbles: true, cancelable: true, pointerId: 7, clientX: x, clientY: y,
    }));

    try {
      __arkui_dom_requireModule('BatchInputDemo');
      __arkui_dom_loadRoute('pages/BatchInputDemo', root);
      await tick(150);                                   // PatternLock 的 layout() 在 setTimeout(0) 里跑
      const cg = el('cg1');
      const apple = el('cb-apple');
      const banana = el('cb-banana');
      const pl = el('pl1');

      // ══════════ ① CheckboxGroup（7 条） ══════════
      check(!!cg && cg.tagName === 'INPUT' && cg.type === 'checkbox' && cg.dataset.checkboxGroup === 'fruits',
        `CheckboxGroup 基座：原生 checkbox + 组名（实际 tag=${cg && cg.tagName} group='${cg && cg.dataset.checkboxGroup}'）`);
      check(cg.dataset.status === '2',
        `selectAll(false) 初始 → status None(2)（实际 '${cg && cg.dataset.status}'）`);
      cg.click();
      check(cg.checked && cg.dataset.status === '0' && apple.checked && banana.checked,
        `点母节点 → 全选 All(0)，组员同步（apple=${apple && apple.checked} banana=${banana && banana.checked}）`);
      await tick(20);                                    // @State → DOM 异步重渲染（R146 教训）
      check(txt('cg-log').includes('CG2/0'),
        `onChange({name:['apple','banana'], status:0})（实际 log='${txt('cg-log')}'）`);
      banana.click();                                    // 组员自态变化 → 组状态 Part
      await tick(20);
      check(cg.indeterminate && cg.dataset.status === '1',
        `组员取消 → 组 Part(1)：母 indeterminate（实际 status='${cg && cg.dataset.status}' ind=${cg && cg.indeterminate}` +
        ` checked=${cg && cg.checked}）`);
      check(txt('cg-log').includes('CG1/1'),
        `组员带动 onChange({name:['apple'], status:1})（实际 log='${txt('cg-log')}'）`);
      check(cg.style.accentColor === '#007dff' || cg.style.accentColor === 'rgb(0, 125, 255)',
        `selectedColor → 母节点 accent-color（实际 '${cg && cg.style.accentColor}'）`);

      // ══════════ ② PatternLock（7 条） ══════════
      const dots = pl.querySelectorAll('[data-pl-dot]');
      check(!!pl && dots.length === 9 && !!pl.querySelector('[data-pl-line]'),
        `PatternLock 基座：9 点位 + SVG 连线层（实际 dots=${dots.length}）`);
      check(pl.style.width === '240px' && pl.style.height === '240px',
        `sideLength(240) → 240px（实际 '${pl.style.width}'）`);
      check(dots[0].style.width === '24px',
        `circleRadius(12) → 点直径 24px（实际 '${dots[0].style.width}'）`);
      const c1 = dots[0].getBoundingClientRect();
      const c2 = dots[1].getBoundingClientRect();
      const c3 = dots[2].getBoundingClientRect();
      firePointer(pl, 'pointerdown', c1.left + c1.width / 2, c1.top + c1.height / 2);
      firePointer(pl, 'pointermove', c2.left + c2.width / 2, c2.top + c2.height / 2);
      firePointer(pl, 'pointermove', c3.left + c3.width / 2, c3.top + c3.height / 2);
      firePointer(pl, 'pointerup', c3.left + c3.width / 2, c3.top + c3.height / 2);
      await tick(10);
      check(pl.dataset.sequence === '1-2-3',
        `手势 1→2→3：sequence 1-2-3（实际 '${pl.dataset.sequence}'）`);
      check(txt('pl-log').includes('D1;D2;D3;') && txt('pl-log').includes('P123;'),
        `onDotConnect ×3 + onPatternComplete([1,2,3])（实际 log='${txt('pl-log')}'）`);
      // 控制器：类必须挂 global（产物里 new PatternLockController() 是自由变量引用）；
      // 实例在产物闭包里，测试够不到 —— reset 机制经状态袋验证（控制器委托的就是它）
      check(typeof globalThis.PatternLockController === 'function',
        `PatternLockController 已挂 global（产物可 new）`);
      pl.__patternLock.reset();
      await tick(10);
      check(pl.dataset.sequence === '' && pl.dataset.challengeResult === undefined,
        `reset() 清空序（控制器委托同一机制；实际 sequence='${pl.dataset.sequence}'）`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';
  })();
  </script>
</body>
</html>
