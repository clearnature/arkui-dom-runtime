<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>R30：UIContext（getUIContext 的现代 API 面）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  #root { width: 320px; }
  #result { margin-top: 12px; font-family: ui-monospace, monospace; white-space: pre; }
  .pass { color: #2e7d32; } .fail { color: #c62828; }
</style>
</head>
<body>
  <h3>R30：UIContext（getUIContext 不再 TypeError / animateTo / getRouter / runScopedTask）</h3>
  <div id="root"></div>
  <div id="result">running…</div>

  <script src="../runtime/generated-components.js"></script>
  <script src="../runtime/arkui-dom-runtime.js"></script>
  <script src="../runtime/ohos-shims.js"></script>
  <script src="../build/uictxdemo-module.js"></script>
  <script>
  (async function () {
    const lines = [];
    let allPass = true;
    const check = (c, m) => { if (!c) allPass = false; lines.push((c ? 'PASS' : 'FAIL') + ' ' + m); };
    const tick = (ms) => new Promise((r) => setTimeout(r, ms));
    const root = document.getElementById('root');
    const el = (id) => root.querySelector('#' + id);
    const txt = (id) => String(el(id) ? el(id).textContent : '<缺>');
    const click = (id) => el(id).dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    const group = async (name, fn) => {
      try { await fn(); } catch (e) {
        allPass = false;
        lines.push(`FAIL [${name}] 抛出异常：${e && e.stack ? String(e.stack).split('\n')[0] : e}`);
      }
    };

    try {
      __arkui_dom_requireModule('UiContextDemo');
      __arkui_dom_loadRoute('pages/UiContextDemo', root);
      await tick(80);
      check(!!el('go-btn') && !!el('uc-log'), 'UiContextDemo 页面已渲染');

      // ══════════ ① 点击 go：UIContext 的四个实测面逐一生效 ══════════
      await group('UIContext 面', async () => {
        click('go-btn');
        await tick(60);
        check(txt('uc-log') === 'UI1;RT1;SC;', `四个面按序生效（log='${txt('uc-log')}'）`);
        check(txt('uc-msg') === 'B', `animateTo 的回调同步执行（msg '${txt('uc-msg')}'）`);
        // animateTo 是真动画：走显式动画管道（__arkui_dom_animations 的 history 有 api='animateTo' 记录）
        const hist = __arkui_dom_animations().history;
        check(hist.length >= 1 && hist[hist.length - 1].api === 'animateTo',
          `显式动画运行记录 +1（api=${hist[hist.length - 1] && hist[hist.length - 1].api}）`);
        check(typeof __arkui_dom_transitions === 'function', '显式动画自省钩子可用');
      });

      // ══════════ ② ViewV2 继承：@ComponentV2 组件同样拿到 getUIContext ══════════
      // （fixtures/pages/V2.ts 的组件走 ViewV2 extends ViewPU —— 原型链验证）
      await group('继承面', async () => {
        const v2proto = Object.getPrototypeOf((root.__arkuiViews || [])[0] || root);
        check(Object.getPrototypeOf(ViewPU.prototype) === Object.prototype
          || typeof ViewPU.prototype.getUIContext === 'function',
          `ViewPU 原型挂上 getUIContext（${typeof ViewPU.prototype.getUIContext}）`);
        // 重复调用返回独立对象但行为一致
        const a = ViewPU.prototype.getUIContext();
        const b = ViewPU.prototype.getUIContext();
        check(typeof a.animateTo === 'function' && typeof b.animateTo === 'function' && a !== b,
          `多次调用各自拿到对象（a!==b：${a !== b}）`);
      });

      // ══════════ ③ 回归：没有"未实现"假警告 ══════════
      await group('回归', async () => {
        const bad = __arkui_dom_layout_warnings.filter((w) => /getUIContext|UIContext/.test(String(w)));
        check(bad.length === 0, `UIContext 不再记"未实现/抛错"（剩 ${bad.length} 条：${bad.slice(0, 2).join('|')}）`);
      });

      lines.push(`UICXT log='${txt('uc-log')}' msg='${txt('uc-msg')}'`);
      lines.push(`ELMT ${__arkui_dom_elmtRecords.size}`);
    } catch (e) {
      allPass = false;
      lines.push('FAIL 抛出异常: ' + (e && e.stack ? e.stack : e));
    }

    lines.unshift(allPass ? '=== ALL PASS ===' : '=== HAS FAILURE ===');
    const out = document.getElementById('result');
    out.textContent = lines.join('\n');
    out.className = allPass ? 'pass' : 'fail';
    document.title = allPass ? 'PASS' : 'FAIL';
  })();
  </script>
</body>
</html>
