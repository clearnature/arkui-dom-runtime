# kernel · 内核统一契约 CI（R159.3 起）
#
# 价值：R119 的「多语言契约等价性」（同一份 41 条断言全绿）从本地证据升级为
# CI 常驻守卫——任一内核的 ABI/FSM/作业面回归当场红。
#
# CI 范围（如实）：libkernel*.so 已入仓 → **c/go/rs 三内核 direct 直载**零工具链
# 依赖；cangjie（运行时=31MB 华为 nightly 二进制，不再分发）与 hs（GHC RTS 闭包）
# 由脚本自带 SKIP 机制如实留痕——这两内核的权威=本地+鸿蒙模拟器端+打包态。
# 方法参考：Reasonix ci.yml（permissions/concurrency/矩阵）× kernel/run-contract.sh。

name: "kernel · 内核统一契约（c/Go/Rust 直载 + cangjie/hs SKIP 留痕）"

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kernel-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (node ${{ matrix.node }})
    runs-on: ubuntu-24.04   # 钉 24.04：ubuntu-latest 2026-10-19 起迁 Ubuntu 26——适配另做验证切片
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: 内核 .so 在位确认
        run: |
          for k in c-sample/libkernel_c.so go/libkernel_go.so rust/libkernel_rs.so; do
            test -s "kernel/$k" || { echo "❌ 缺 kernel/$k"; exit 1; }
          done
          echo "✅ 直载内核 .so 齐备（cangjie/hs 运行时 SKIP 留痕属预期）"
      - name: 内核统一契约（41 断言 × c/go/rs 直载；cangjie/hs SKIP 留痕；退出码=守门）
        run: bash kernel/run-contract.sh all
