# ubuntu · WebKit CI（R159.3 起）——第四引擎（WebKitGTK via playwright）
#
# 与本地 webkit/run.sh 同一驱动：playwright WebKitGTK + #result 单通道判定
# （坑 115：title 快通道会带走陈旧快照）+ assert-overrides 分端差异
# （realfs OPFS 探测 20/21 两态皆合法）。真实时钟——无虚拟时间豁免页。
# playwright 版本钉 1.63.0（与本地 wk-venv 同版，WebKit 构建一致）。

name: "ubuntu · WebKit · 全矩阵 87 用例"

on:
  push:
    branches: [main, ci]
  pull_request:
    types: [labeled]          # ci/full 标签审核制：维护者加标签触发 PR 全量
  workflow_dispatch: {}

# 治理（R159.3，参考 Reasonix 前置 CI 模型）：PR 只跑 pr-gate.yml（轻量前置：
#   body 三要素声明检查 + 快检）；本重矩阵仅在 push main/ci 与手动触发——
#   免审 PR 不烧重算力，审核后要全量可 workflow_dispatch --ref <PR 分支>。
permissions:
  contents: read

concurrency:
  group: ubuntu-webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci/full'
    name: webkit (node ${{ matrix.node }})
    runs-on: ubuntu-24.04   # 钉 24.04（同家族理由）
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    env:
      NODE: node
      WK_PYTHON: python3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Python + playwright + WebKitGTK（版本钉 1.63.0=本地同款）
        run: |
          python3 -m pip install --user --break-system-packages playwright==1.63.0
          python3 -m playwright install --with-deps webkit
          python3 -c "from playwright.sync_api import sync_playwright; print('playwright ✅')"
      - name: 字体对齐（textmeasure 度量，同 browser 腿）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core
      - name: webkit/run.sh all（87 用例 + 断言计数守门，overrides 分端差异）
        env:
          WK_PYTHON: python3
        run: bash webkit/run.sh all
      - name: 失败留档（计数表 + 矩阵日志）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: webkit-logs-node${{ matrix.node }}
          path: |
            build/assert-counts-webkit.tsv
            build/wk-matrix.log
          if-no-files-found: ignore
          retention-days: 7
