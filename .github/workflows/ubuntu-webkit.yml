# ubuntu · WebKit CI（R159.3 起）——第四引擎（WebKitGTK via playwright）
#
# 与本地 webkit/run.sh 同一驱动：playwright WebKitGTK + #result 单通道判定
# （坑 115：title 快通道会带走陈旧快照）+ assert-overrides 分端差异
# （realfs OPFS 探测 20/21 两态皆合法）。真实时钟——无虚拟时间豁免页。
# playwright 版本钉 1.63.0（与本地 wk-venv 同版，WebKit 构建一致）。

name: "ubuntu · WebKit · 全矩阵 87 用例"

on:
  push:
    branches: [main, ci]
  pull_request:
    types: [labeled]          # ci/full 标签审核制：维护者加标签触发 PR 全量
  workflow_dispatch: {}

# 治理（R159.3，参考 Reasonix 前置 CI 模型）：PR 只跑 pr-gate.yml（轻量前置：
#   body 三要素声明检查 + 快检）；本重矩阵仅在 push main/ci 与手动触发——
#   免审 PR 不烧重算力，审核后要全量可 workflow_dispatch --ref <PR 分支>。
permissions:
  contents: read

concurrency:
  group: ubuntu-webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    with:
      node-version: ${{ matrix.node }}
    uses: clearnature/arkui-ci/.github/workflows/webkit-matrix.yml@27d16e805407c8a773336998a0fe8a5a39522a7c
