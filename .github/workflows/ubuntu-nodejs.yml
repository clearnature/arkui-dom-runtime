# ubuntu · Node.js V8 环境 CI（R159.3 起）—— 方法与目录结构参考：
#   · /home/yanli/work/DeepSeek-Reasonix/.github/workflows/ci.yml
#     （.node-version 钉默认版本 / setup-node@v7 / permissions+concurrency 块 /
#      矩阵腿命名「job (os)」/ 失败留档注释文化）
#   · /data/training/cli/codex/.github/workflows/（workflow 按域拆分多文件，
#     文件名自述环境——本项目沿用：每个 CI 环境一个文件，Actions 后台按
#     下面的 name: 分条显示，一眼看出跑的是哪套环境测试）
#
# 本项目 workflow 命名约定（后续很多 CI 都要写，命名必须自述环境）：
#   .github/workflows/ubuntu-nodejs.yml   = 本文件：ubuntu · Node.js 24/26 · V8
#   .github/workflows/windows-browser.yml = 二期：windows · Chrome/Firefox/Electron
#   .github/workflows/macos-safari.yml    = 三期：macos · Safari（safaridriver 第六端）
#
# 本文件范围（一期）：ubuntu-latest × Node 24/26 —— V8 双环境：
#   · toolchain：Node 工具链（拼接产物逐字节一致 + fixtures 抽取冒烟）
#   · browser  ：Chrome headless 全矩阵（run.sh all，85 用例 + 断言计数守门）
#
# CI 上明确跳过的本地专属步（缺席显式跳过，同 webkit 6c 先例）：
#   gen-components --check（需本地 SDK 路径）/ typecheck（TS 4.9.5 硬编码路径）/
#   stats 性能基线（权威=本地 Electron）/ Android 端（模拟器不上 CI）/ 鸿蒙模拟器。

name: "ubuntu · Node.js 24/26 · V8（toolchain + Chrome 浏览器矩阵）"

on:
  push:
    branches: [main, ci]
  workflow_dispatch: {}        # 手动按钮：GitHub 页面 Actions → CI → Run workflow

# 治理（R159.3，参考 Reasonix 前置 CI 模型）：PR 只跑 pr-gate.yml（轻量前置：
#   body 三要素声明检查 + 快检）；本重矩阵仅在 push main/ci 与手动触发——
#   免审 PR 不烧重算力，审核后要全量可 workflow_dispatch --ref <PR 分支>。
permissions:
  contents: read

concurrency:
  # 必须带 workflow 前缀（多 workflow 共存后，全局组会跨文件互相取消）
  group: ubuntu-nodejs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Node 工具链（V8 双版本：24/26）──
  # 测的是「构建/抽取工具链在新 Node 上行为一致」：拼接产物必须逐字节一致
  # （build-runtime --check），任何一版 Node 上产物漂移都是真问题。
  toolchain:
    name: toolchain (node ${{ matrix.node }})
    runs-on: ubuntu-24.04   # 钉 24.04：ubuntu-latest 2026-10-19 起迁 Ubuntu 26（runner-images#14748）——迁移适配另做验证切片
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Node 版本
        run: node --version
      - name: build-runtime --check（拼接产物逐字节一致）
        run: node tools/build-runtime.mjs --check
      - name: extract 冒烟（Index → build/app.js）
        run: |
          mkdir -p build
          node tools/extract.mjs fixtures/pages/Index.ts build/app.js
          # 类型残留由 extract.mjs 自检（run_one 每例都打印「类型残留: ✅ 无」），
          # 这里不再另写正则——对象字面量 key: value 会误报

  # ── browser 端全矩阵（Chrome headless = V8 环境）──
  # run.sh all：85 用例 + 退出时断言计数守门（文档「（N 条断言）」vs 实测逐条比对，
  # 与本地门禁同一套守卫）。Node 版本只影响工具链（抽取/守门），浏览器渲染用
  # Chrome 自带 V8——双版本跑同一矩阵是为了一并守住工具链确定性。
  browser:
    name: browser (node ${{ matrix.node }})
    runs-on: ubuntu-24.04   # 钉 24.04：ubuntu-latest 2026-10-19 起迁 Ubuntu 26（runner-images#14748）——迁移适配另做验证切片
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    env:
      # run.sh 三处本地路径的 CI 覆盖（R159.3 参数化）：
      # NODE 用 PATH 解析——指向 setup-node 装的矩阵版本（写死 /usr/bin/node 会
      # 绕过 24/26 矩阵、落到 runner 系统自带 node）；runner 预装 Google Chrome
      NODE: node
      CHROME: /usr/bin/google-chrome
      # 虚拟时间豁免清单（R159.3 十一跑后裁定）：真实解码页（imageext/measimage——
      # 解码回调不到）+ 真实时序页（builtindemo——动画收口/摩擦轮转 flake，预算
      # 迭代降频未根除）在虚拟时间 browser CI 腿跳过；权威=真实时钟端
      # （Electron CI 腿 ubuntu-electron.yml / firefox / webkit / android / 本地）
      ARKUI_CHROME_DEBUG: "0"
      ARKUI_VIRTUAL_TIME_SKIP: "builtindemo imageext measimage"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Chrome 就位确认（runner 预装，缺席即刻显式失败）
        run: |
          test -x "$CHROME" || { echo "❌ 未找到 $CHROME——ubuntu runner 应预装 Google Chrome"; exit 1; }
          "$CHROME" --version
          node --version
      - name: 安装字体（CI 二跑实测：runner 缺 Noto Sans CJK，textmeasure 的
          换行/行高断言按本地字体度量冻结——字体环境必须对齐，否则假红）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core
          fc-match sans-serif
      - name: run.sh all（85 用例 + 断言计数守门）
        run: bash run.sh all
      - name: 失败留档（截图 + 计数表）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-logs-node${{ matrix.node }}
          path: |
            build/*.png
            build/assert-counts-browser.tsv
          if-no-files-found: ignore
          retention-days: 7
