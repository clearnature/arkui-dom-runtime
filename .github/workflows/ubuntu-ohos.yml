# ubuntu · HarmonyOS CLT 26.0.0.821 —— hvigorw 编译 + fixtures 漂移守门（R159.3 起）
#
# 版本策略（2026-10-02 与用户对齐）：**全线锁 26.0.0.821**——与本地 CLT
# （/data/training/cli/commandline-tools-linux-x64-26.0.0.821）逐版本一致，
# fixtures 漂移守门（重编译 vs 冻结件逐字节 diff）才有意义。
#   · ErBWs/setup-ohos@v2：镜像 ErBWs/ohos-sdk 里 26.0.0 线实有 821（四平台
#     linux-amd64/mac-amd64/mac-arm64/windows-amd64 + sha256，2026-10-02 核实）。
#   · wm-develop/setup-ohos@v3 名义支持 26.0.0，实测其镜像只有 621——排除
#     （621 会引入比本地还旧的版本倒退）。
#   · 官网 26.0.0.851（2026/09/23，五平台）直链在开发者站背后、两镜像均未收录
#     ——升级走独立切片：本地先升 851 + 重冻结全部 fixtures + 全门禁重验，
#     CI 再同步换版本（可给 ErBWs/ohos-sdk 提 PR 贡献 851 包）。
#
# arkts-shim 说明（vendor 于 tools/arkts-shim/shim.c，本项目自有代码）：
#   CLT 26.0.0.821 在 Linux 缺两个库——libhilog（命名问题：SDK 自带 libhilog_linux.so，
#   符号齐）+ libshared_libz（不存在，实为 zlib+minizip 合并库）。hvigorw/ets-loader
#   纯 JS 构建链【不需要】shim；但 **AOT 静态编译器 ark_aot_compiler 需要**——
#   本 job 含 AOT 检查步：runner 上就地重建 shim（零华为二进制再分发——libhilog
#   从下载好的 SDK 改名副本、libshared_libz 用仓库内 shim.c 现编），
#   然后把 hvigorw 产物的 modules.abc 静态编译为 .an 原生码并核验 ELF。
#   本地端到端验证（2026-10-02）：587KB modules.abc → 5.5MB out.an ✅
#   （build/aot-local-verify.sh；shim 详细考证见 /data/training/cli/arkts-shim/README.md）
#
# 与本地门禁的分工：本地 11 步门禁的 gen-components --check / typecheck 依赖
# 本地 CLT 路径——本 job 让 gen-components --check 首次在 CI 可跑；typecheck
# 仍本地专属（TS 4.9.5 路径硬编码，见 workflow 家族头注）。

name: "ubuntu · HarmonyOS CLT 26.0.0.821（hvigorw 编译 + fixtures 漂移守门）"

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main]
  workflow_dispatch: {}        # 手动按钮（Actions 后台按本名分条显示）

permissions:
  contents: read

concurrency:
  group: ubuntu-ohos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ohos-toolchain:
    name: ohos-toolchain (CLT 26.0.0.821)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup HarmonyOS NEXT CLI tools（锁 26.0.0.821=本地同版本）
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true              # SDK ~GB 级，缓存后非首跑零下载

      - name: 安装 Linux 依赖（libGL1 纹理压缩 + minizip/unzip 供 AOT 步）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libminizip1 unzip

      - name: CLT 就位确认
        run: |
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"
          hvigorw -v
          # HOS_SDK_HOME=…/ohos-sdk/command-line-tools/sdk → CLT 根=它的上一级
          echo "CLT_ROOT=$(dirname "$HOS_SDK_HOME")" >> "$GITHUB_ENV"

      - name: hvigorw 全量编译冒烟（BUILD SUCCESSFUL 判定）
        run: |
          export DEVECO_CLI_CLT_PATH="$CLT_ROOT"
          unset DEVECO_NODE_HOME          # 必须空着才会用 CLT 自带的 node（本地配方同款）
          (cd harmony-proj && "$DEVECO_CLI_CLT_PATH/bin/hvigorw" --no-daemon assembleHap)

      # ── AOT 静态编译检查：ArkTS=TS 超集，静态编译是这条工具链独有的能力——
      # 云端能「真编译」的证据链 = hvigorw 出 .abc + ark_aot_compiler 出 .an 原生码。
      # 配方=build/aot-local-verify.sh 的 CI 版（2026-10-02 本地端到端验证 ✅）。
      - name: AOT 静态编译检查（arkts-shim 就地重建：modules.abc → .an 原生码）
        run: |
          ARKBIN="$CLT_ROOT/sdk/default/openharmony/ets/build-tools/ets-loader/bin/ark/build/bin"
          SHIM="$RUNNER_TEMP/arkts-shim"
          mkdir -p "$SHIM"
          # ① libhilog 命名修复：SDK 自带 libhilog_linux.so 的改名副本（不再分发华为二进制）
          cp "$ARKBIN/libhilog_linux.so" "$SHIM/libhilog.so"
          # ② libshared_libz：仓库内 shim.c 现编（zlib+minizip 合并垫片，3 个转发符号）
          gcc -shared -fPIC -o "$SHIM/libshared_libz.so" tools/arkts-shim/shim.c \
            -Wl,--no-as-needed -l:libz.so.1 -l:libminizip.so.1
          # ③ hvigorw 产物里的 modules.abc → .an/.ai
          unzip -o -q harmony-proj/entry/build/default/outputs/default/entry-default-unsigned.hap \
            'ets/modules.abc' -d "$RUNNER_TEMP/hap"
          export LD_LIBRARY_PATH="$SHIM:$ARKBIN${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$ARKBIN/ark_aot_compiler" --aot-file="$RUNNER_TEMP/out" "$RUNNER_TEMP/hap/ets/modules.abc"
          # ④ 产物核验：.an 必须是非空 ELF
          test -s "$RUNNER_TEMP/out.an"
          file "$RUNNER_TEMP/out.an" | grep -q ELF
          echo "✅ AOT 静态编译：modules.abc（$(du -h "$RUNNER_TEMP/hap/ets/modules.abc" | cut -f1)）→ $(du -h "$RUNNER_TEMP/out.an" | cut -f1) 原生码 ELF"

      # ── fixtures 漂移守门：本地已知坑的首个守卫（多代理并行期间 fixtures 会与
      # .ets 源漂移——测试读旧冻结件全 null，此前无任何守卫）。
      # 首期【只报告不拦截】：同版本同输入理应逐字节一致，但 runner 环境差异
      # （node 版本/文件序）未验证，先观察一轮基线，确认零 diff 后转 exit 1 硬拦截。
      - name: fixtures 漂移检查（首期只报告，转硬拦截见注释）
        run: |
          export DEVECO_CLI_CLT_PATH="$CLT_ROOT"
          CACHE="harmony-proj/entry/build/default/cache/default/default@CompileArkTS/esmodule/debug/entry/src/main/ets"
          fail=0
          for f in fixtures/pages/*.ts; do
            rel="pages/$(basename "$f")"
            if ! diff -u "$CACHE/$rel" "$f" > /tmp/driftpatch.txt 2>&1; then
              echo "❌ 漂移：$rel"; head -20 /tmp/driftpatch.txt; fail=1
            fi
          done
          for f in fixtures/entryability/*.ts; do
            rel="entryability/$(basename "$f")"
            if ! diff -u "$CACHE/$rel" "$f" > /tmp/driftpatch.txt 2>&1; then
              echo "❌ 漂移：$rel"; head -20 /tmp/driftpatch.txt; fail=1
            fi
          done
          # 转硬拦截时：去掉下一行的注释、删除上面的 fail 旁路
          # exit $fail
          [ "$fail" = 1 ] && echo "⚠️ 发现漂移（首期只报告；基线确认后转硬拦截）" || echo "✅ fixtures 与重编译产物逐字节一致"
          exit 0

      - name: gen-components --check（149 组件骨架生成一致性——CI 首次可跑）
        env:
          DEVECO_CLI_CLT_PATH: ${{ env.CLT_ROOT }}   # gen-components.mjs 读此变量定位 SDK
        run: node tools/gen-components.mjs --check
