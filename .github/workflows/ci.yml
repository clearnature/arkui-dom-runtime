# CI 治理入口（R159.3 起）——编排逻辑全部在治理仓 arkui-ci（SHA 钉死）。
# 本文件只做【引擎 × 命令】的装配：项目适配（抽取趟/字体/geckodriver/虚构时间
# 豁免清单）全部内联在 setup/test-command 里，任何引擎的执行器都是治理仓的
# 通用 reusable。
#
# 跳过清单（CI 上不跑的本地专属步）：gen-components --check（本地 SDK 路径）/
# stats 性能基线（权威=本地 Electron）/ Android 端（模拟器，R174 用户裁定移动端停止
# 验证）/ 鸿蒙模拟器 / builtindemo+imageext+measimage（虚拟时间+负载下时序与解码
# 投递不稳——权威=electron 真实时钟腿与本地）。
# R174 全补：typecheck 已上云（ubuntu-ohos 腿 ARKUI_CLT）；node 矩阵收单轴 26
# （LTS24/Current26 双轴收敛——harness 环境轴低价值，产品跑 Electron 自带 V8；
# 临时要 24 可改回 matrix）；kernel-contract/kernel-compilers 迁独立 kernel.yml
# （手动+周触发——五语言内核线已随 R120 收口，不随每次 push 烧）。

name: "CI · 治理链（多引擎矩阵）"

on:
  push:
    branches: [main, ci]
  pull_request:
    types: [labeled]
  # 手动触发用于验证治理仓（arkui-ci）改动是否真能在 runner 上跑通——
  # 治理仓 13 个工作流全是 workflow_call，开 PR/合并都不会跑任何 job。
  # legs 按逗号分隔精确匹配 job id（逗号包边避免 browser 误匹配 browser-windows）。
  workflow_dispatch:
    inputs:
      legs:
        description: '要跑的腿（逗号分隔）。可用：browser,browser-windows,electron,firefox,electron-windows,firefox-windows,webkit-windows,webkit；all=全跑'
        required: false
        default: 'browser,browser-windows'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'ci/full')
      && (github.event_name != 'workflow_dispatch'
          || contains(format('{0}', inputs.legs), 'all')
          || contains(format(',{0},', inputs.legs), ',browser,'))
    name: browser (node 26)
    uses: clearnature/arkui-ci/.github/workflows/browser.yml@be3508353cda4546b8af6c645b44ca2a4829fe8a
    with:
      # U26 迁移（2026-10-19 ubuntu-latest 迁 26；六腿 26.04 全量验证 run 37136198612 全绿）
      runner: ubuntu-26.04
      node-version: "26"
      # 虚拟时间豁免清单内联在 test-command 里（caller job 不允许 env:——schema 只允许 with/secrets）
      test-command: ARKUI_VIRTUAL_TIME_SKIP="builtindemo imageext measimage" bash run.sh all
      artifact-path: |
        build/*.png
        build/assert-counts-browser.tsv

  browser-windows:
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'ci/full')
      && (github.event_name != 'workflow_dispatch'
          || contains(format('{0}', inputs.legs), 'all')
          || contains(format(',{0},', inputs.legs), ',browser-windows,'))
    name: browser-windows (node 26)
    uses: clearnature/arkui-ci/.github/workflows/browser-windows.yml@be3508353cda4546b8af6c645b44ca2a4829fe8a
    with:
      # Windows runner 计费 2×：先单 node 版本（Windows 特有差异与 node 无关）
      node-version: "26"
      # 豁免清单同 browser 腿；Windows 首跑按 PLAN-WINDOWS-CI.md T3 预期 2–5 轮调优。
      # PYTHON=python：windows runner 不保证有 python3 命令名（python 必有）
      test-command: PYTHON=python ARKUI_VIRTUAL_TIME_SKIP="builtindemo imageext measimage" bash run.sh all
      artifact-path: |
        build/*.png
        build/assert-counts-browser.tsv

  electron:
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'ci/full')
      && (github.event_name != 'workflow_dispatch'
          || contains(format('{0}', inputs.legs), 'all')
          || contains(format(',{0},', inputs.legs), ',electron,'))
    name: electron (node 26)
    uses: clearnature/arkui-ci/.github/workflows/electron-realtime.yml@be3508353cda4546b8af6c645b44ca2a4829fe8a
    with:
      # U26 迁移（2026-10-19 ubuntu-latest 迁 26；六腿 26.04 全量验证 run 37136198612 全绿）
      runner: ubuntu-26.04
      node-version: "26"

  firefox:
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'ci/full')
      && (github.event_name != 'workflow_dispatch'
          || contains(format('{0}', inputs.legs), 'all')
          || contains(format(',{0},', inputs.legs), ',firefox,'))
    name: firefox (node 26)
    uses: clearnature/arkui-ci/.github/workflows/firefox.yml@be3508353cda4546b8af6c645b44ca2a4829fe8a
    with:
      # U26 迁移（2026-10-19 ubuntu-latest 迁 26；六腿 26.04 全量验证 run 37136198612 全绿）
      runner: ubuntu-26.04
      node-version: "26"
      test-command: bash firefox/run.sh all
      artifact-path: |
        build/assert-counts-firefox.tsv
        build/ff-matrix.log

  # Windows 二期三腿（W2-1/W2-2/W2-3，PLAN-WINDOWS-CI.md）：单 node 26——
  # Windows runner 计费 2×；webkit-windows 口径=Win32 口味 WebKit（第三种
  # WebKit，与 WebKitGTK 不互推）。首跑按 T3 纪律：目标是诊断透出。
  electron-windows:
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'ci/full')
      && (github.event_name != 'workflow_dispatch'
          || contains(format('{0}', inputs.legs), 'all')
          || contains(format(',{0},', inputs.legs), ',electron-windows,'))
    name: electron-windows (node 26)
    uses: clearnature/arkui-ci/.github/workflows/electron-windows.yml@be3508353cda4546b8af6c645b44ca2a4829fe8a
    with:
      node-version: "26"
      test-command: bash electron/run.sh all
      artifact-path: |
        build/*.png
        build/assert-counts-electron.tsv

  firefox-windows:
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'ci/full')
      && (github.event_name != 'workflow_dispatch'
          || contains(format('{0}', inputs.legs), 'all')
          || contains(format(',{0},', inputs.legs), ',firefox-windows,'))
    name: firefox-windows (node 26)
    uses: clearnature/arkui-ci/.github/workflows/firefox-windows.yml@be3508353cda4546b8af6c645b44ca2a4829fe8a
    with:
      node-version: "26"
      test-command: bash firefox/run.sh all
      artifact-path: |
        build/assert-counts-firefox.tsv
        build/ff-matrix.log

  webkit-windows:
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'ci/full')
      && (github.event_name != 'workflow_dispatch'
          || contains(format('{0}', inputs.legs), 'all')
          || contains(format(',{0},', inputs.legs), ',webkit-windows,'))
    name: webkit-windows (node 26)
    uses: clearnature/arkui-ci/.github/workflows/webkit-windows.yml@be3508353cda4546b8af6c645b44ca2a4829fe8a
    with:
      node-version: "26"
      test-command: bash webkit/run.sh all
      artifact-path: |
        build/assert-counts-webkit.tsv
        build/wk-matrix.log

  webkit:
    if: >-
      (github.event_name != 'pull_request' || github.event.label.name == 'ci/full')
      && (github.event_name != 'workflow_dispatch'
          || contains(format('{0}', inputs.legs), 'all')
          || contains(format(',{0},', inputs.legs), ',webkit,'))
    name: webkit (node 26)
    uses: clearnature/arkui-ci/.github/workflows/webkit.yml@be3508353cda4546b8af6c645b44ca2a4829fe8a
    with:
      # U26 迁移（2026-10-19 ubuntu-latest 迁 26；六腿 26.04 全量验证 run 37136198612 全绿）
      runner: ubuntu-26.04
      node-version: "26"
      test-command: bash webkit/run.sh all
      artifact-path: |
        build/assert-counts-webkit.tsv
        build/wk-matrix.log
