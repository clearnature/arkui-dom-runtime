# package · 打包 CI（R159.3 起）——治理链「测试 → 打包」的打包段
#
# 依赖：CI · 治理链（多引擎矩阵）成功后才触发（workflow_run 链式依赖——
#   测试矩阵全绿是打包的前置条件，Copilot PR 审查意见落实）。
# 产物：Electron 目录分发 tar.gz（102 测试页 + 90 模块 + cjk/hs 内核分发集）
# + 包内冒烟（perfdemo ELECTRON_RESULT 必须 PASS——packager 自带冒烟）。
#
# 工具：tools/package-app.mjs（R81 固化、R88/R109/R127/R134 历代增强）——
#   · Electron zip 预热：官方 Releases 直下到 ~/.cache/electron
#     （packager hasZip 直用；npm install 的缓存位置在 runner 上不可靠）
#   · cjk 分发集：CI 无仓颉运行时 → 脚本自带降级留痕（权威=本地打包）
#   · hs 分发集：patchelf 装了就有闭包（kernel-compilers 的 ghcup 布局亦可）
# 触发：CI 成功后（workflow_run 链式依赖）+ 手动。ci 分支不跑（省额度）。

name: "package · 打包（Electron 目录分发 tar.gz + 包内冒烟）"

on:
  workflow_run:
    workflows: ["CI · 治理链（多引擎矩阵）"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # 只在触发 workflow（CI 矩阵）成功后才打包
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.workflow_run.head_branch)
    name: 打包 + 包内冒烟（Electron 44.2.0）
    runs-on: ubuntu-26.04   # U26 迁移（探针+六腿验证 run 37136198612 全绿）
    timeout-minutes: 45
    env:
      NODE: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 系统依赖（xvfb 供包内冒烟 + Electron 运行库 + 字体 + patchelf 供 hs 闭包）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libasound2t64 libgbm1 fonts-noto-cjk fonts-dejavu-core patchelf
      # @electron/get 在 runner 上的缓存位置不可靠（实测 npm install 后
      # ~/.cache/electron 不存在）——改从官方 Releases 直接下载 zip（确定性路径）。
      - name: 预热 Electron zip（~/.cache/electron——packager hasZip 直用）
        run: |
          mkdir -p "$HOME/.cache/electron"
          curl -fsSL --retry 3 -o "$HOME/.cache/electron/electron-v44.2.0-linux-x64.zip" \
            https://github.com/electron/electron/releases/download/v44.2.0/electron-v44.2.0-linux-x64.zip
          ls -lh "$HOME/.cache/electron/electron-v44.2.0-linux-x64.zip"
      - name: 产物抽取（两套驱动全量趟——electron 侧模块驱动期才抽取，缺了包内页面 404）
        env:
          NODE: node
        run: |
          ARKUI_EXTRACT_ONLY=1 bash run.sh all
          ARKUI_EXTRACT_ONLY=1 bash electron/run.sh all
          ls build/perfdemo-module.js || { echo "❌ perfdemo-module 缺失"; exit 1; }
      - name: 打包 + 包内冒烟（perfdemo ELECTRON_RESULT=PASS 守门）
        env:
          ARKUI_PKG_TMP: ${{ runner.temp }}
        run: xvfb-run -a node tools/package-app.mjs --out "$RUNNER_TEMP/arkui-pkg-out"
      - name: tar.gz 固化
        run: |
          tar -czf "$RUNNER_TEMP/arkui-dom-desktop-linux-x64.tar.gz" \
            -C "$RUNNER_TEMP/arkui-pkg-out" arkui-dom-electron-linux-x64
          du -h "$RUNNER_TEMP/arkui-dom-desktop-linux-x64.tar.gz"
      - name: 上传分发产物
        uses: actions/upload-artifact@v5
        with:
          name: arkui-dom-desktop-linux-x64
          path: |
            ${{ runner.temp }}/arkui-dom-desktop-linux-x64.tar.gz
          retention-days: 14
