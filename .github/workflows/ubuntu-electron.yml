# ubuntu · Electron 44 CI（R159.3 起）——真实时钟权威端
#
# 定位：**真实时钟**（无 --virtual-time-budget）——V8 浏览器腿上时序敏感的页
# （builtindemo 动画收口/边界摩擦、imageext/measimage 真图像解码）在本端是
# 权威验证（教义「性能/时序权威在 Electron」，R159.3 八跑后裁定落地）。
#
# 版本：Electron 44.2.0（与本地 electron/runtime/ 解包版一致）；
# Node 24/26 矩阵只影响 harness 工具链（extract/守门），Electron 自带
# 独立 Node 运行主进程。
#
# 显示：runner 无 X——xvfb-run 提供 X11（run.sh 的 --ozone-platform=x11 需要），
# ARKUI_OFFSCREEN=1（脚本默认）用 paint 帧截图，不依赖合成器产帧。

name: "ubuntu · Electron 44（真实时钟 · 97 用例 + 断言计数守门）"

on:
  push:
    branches: [main, ci]
  workflow_dispatch: {}

# 治理（R159.3，参考 Reasonix 前置 CI 模型）：PR 只跑 pr-gate.yml（轻量前置：
#   body 三要素声明检查 + 快检）；本重矩阵仅在 push main/ci 与手动触发——
#   免审 PR 不烧重算力，审核后要全量可 workflow_dispatch --ref <PR 分支>。
permissions:
  contents: read

concurrency:
  group: ubuntu-electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: electron (node ${{ matrix.node }})
    runs-on: ubuntu-24.04   # 钉 24.04：ubuntu-latest 2026-10-19 起迁 Ubuntu 26——适配另做验证切片
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    env:
      NODE: node
      ELECTRON: ${{ github.workspace }}/electron/node_modules/electron/dist/electron
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: 系统依赖（Electron 运行库 + 字体对齐 + metacity 窗管 + xvfb）
        run: |
          sudo apt-get update -qq
          # fonts：textmeasure 换行/行高断言按本地字体度量冻结（同 browser 腿）
          # metacity：xvfb 无窗管时 Electron fullscreen/maximize 语义缺失（九跑实证）；
          #   openbox 的 restore 不还原宽度（十六跑实证）——GNOME 系 metacity 与本地一致
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core metacity libnss3 libasound2t64 libgbm1 xvfb
      - name: 安装 Electron 44.2.0（与本地 electron/runtime/ 同版本）
        run: |
          cd electron
          npm install --no-save electron@44.2.0
          # 首跑实证：runner npm 的 postinstall 未下载二进制（992ms 即完）——
          # 显式回退手动触发 electron 的 install.js（下载 dist 到 node_modules）
          if [ ! -x node_modules/electron/dist/electron ]; then
            echo "postinstall 未产出二进制——手动触发 install.js"
            node node_modules/electron/install.js
          fi
          test -x node_modules/electron/dist/electron || { echo "❌ electron 二进制未就位"; exit 1; }
          # --no-sandbox 必带：runner 上 chrome-sandbox 非 root:4755 会 FATAL（run.sh 同款）
          ./node_modules/electron/dist/electron --version --no-sandbox
      # 弃用 GabrielBB/xvfb-action（node20 已废弃警告 + run 只取首行/无引号解析
      # 两个实测约束）——改手动 xvfb-run：全参数自主、编排全在
      # .github/scripts/electron-xvfb-run.sh（metacity 窗管先起、run.sh all 随后）
      - name: electron/run.sh all（97 用例 + 断言计数守门，xvfb + metacity 真实时钟）
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" bash .github/scripts/electron-xvfb-run.sh
      - name: 失败留档（截图 + 计数表）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: electron-logs-node${{ matrix.node }}
          path: |
            build/electron-*.png
            build/assert-counts-electron.tsv
          if-no-files-found: ignore
          retention-days: 7
