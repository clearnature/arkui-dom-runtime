# kernel · 五语言编译器 CI（R159.3 起）——源码 → .so → 统一契约 5/5
#
# 定位（用户裁定）：kernel-contract.yml 验证的是【入仓冻结 .so】的运行时契约；
# 本 workflow 验证【五语言编译器现在还能从源码编出内核】——与 ArkTS AOT 检查
# 同一哲学：编译链的可用性本身是被守卫的对象。
#
# 五工具链与钉定（2026-10-02 核实，SHA 钉死=供应链纪律）：
#   C       gcc（runner 预装）
#   Go      actions/setup-go@40f1582b…（v5），go 1.26（本机 1.27.1，c-shared 语义无版本敏感）
#   Rust    dtolnay/rust-toolchain@7e38f4b4…（master=stable 通道），rustc ≥1.75（本机 1.93.1）
#   Haskell haskell-actions/setup@7fd2bb5c…（v2），GHC 9.14.1（与本地同版；-dynamic 链需要 RTS 共享包）
#   仓颉    Zxilly/setup-cangjie@91463316…（v3，★11 活跃维护），nightly
#           1.3.0-alpha.20260919003053（与本地 nightly 同版本号）
#
# 编译后跑 kernel/run-contract.sh all —— CI 上 cangjie/hs 的运行时由本 job 安装，
# CANGJIE_RT_LIB / GHC_LIB_DIR 动态发现注入 → 契约 5/5（kernel-contract.yml 的
# CI 版是 c/go/rs 3 内核 + cangjie/hs SKIP 留痕，两 workflow 互补）。

name: "kernel · 五语言编译器（源码 → .so → 统一契约 5/5）"

on:
  push:
    branches: [main, ci]
  workflow_dispatch: {}

# 治理（R159.3，参考 Reasonix 前置 CI 模型）：PR 只跑 pr-gate.yml（轻量前置：
#   body 三要素声明检查 + 快检）；本重矩阵仅在 push main/ci 与手动触发——
#   免审 PR 不烧重算力，审核后要全量可 workflow_dispatch --ref <PR 分支>。
permissions:
  contents: read

concurrency:
  group: kernel-compilers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilers:
    name: gcc / go1.26 / rust-stable / ghc-9.14.1 / cjc-nightly
    runs-on: ubuntu-24.04   # 钉 24.04（同家族理由：ubuntu-latest 10-19 起迁 26）
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable

      # GHC 安装器=本地同款（/data/work/functional-programming/ghcup-setup 的
      # haskell/ghcup-setup，GHCUP_INSTALL_BASE_PREFIX=/usr/local → 布局与本地
      # /usr/local/lib/ghc-9.14.1 完全一致，run-contract.sh 默认路径直接命中）
      - uses: haskell/ghcup-setup@d803e6bf19ae60755bc6ac073b6e3929dad3eac2
        with:
          ghc: 9.14.1
        env:
          GHCUP_INSTALL_BASE_PREFIX: /usr/local

      - name: Setup Cangjie（nightly 1.3.0-alpha，与本地同版本号）
        uses: Zxilly/setup-cangjie@91463316b1c359f216c2ac49e35900f9341c1571
        with:
          channel: nightly
          version: 1.3.0-alpha.20260919003053

      - name: 运行时库路径发现（GHC 包库 / RTS 双目录 + 仓颉运行时）
        run: |
          CJ_RT="$(find "$HOME" /opt /usr/local -type d -name 'linux_x86_64_cjnative' 2>/dev/null | head -1)"
          test -n "$CJ_RT" || { echo "❌ 未找到仓颉运行时目录（linux_x86_64_cjnative）"; exit 1; }
          echo "CANGJIE_RT_LIB=$CJ_RT" >> "$GITHUB_ENV"
          echo "CANGJIE_RT_LIB=$CJ_RT"
          # GHC 双库按【文件名】全根搜索（十四跑：目录猜测对 runner 态敏感）——
          # 调试信息无条件回显（which ghc/print-libdir/命中路径），红跑也带全证据
          echo "which ghc: $(which ghc 2>/dev/null) | readlink: $(readlink -f "$(which ghc 2>/dev/null)" 2>/dev/null)"
          echo "ghc --print-libdir: $(ghc --print-libdir 2>/dev/null)"
          ROOTS="/usr/local/.ghcup $HOME/.ghcup /opt/hostedtoolcache /usr/local/lib"
          RTS_FILE="$(find $ROOTS -name 'libHSrts-1.0.3-ghc9.14.1.so' 2>/dev/null | head -1)"
          INT_FILE="$(find $ROOTS -name 'libHSghc-internal-9.1401.0-*.so' 2>/dev/null | grep -v _p- | head -1)"
          echo "RTS_FILE=$RTS_FILE"
          echo "INT_FILE=$INT_FILE"
          test -n "$RTS_FILE" || { echo "❌ 未找到 libHSrts"; exit 1; }
          test -n "$INT_FILE" || { echo "❌ 未找到 libHSghc-internal"; exit 1; }
          echo "GHC_RTS_DIR=$(dirname "$RTS_FILE")" >> "$GITHUB_ENV"
          echo "GHC_LIB_DIR=$(dirname "$INT_FILE")" >> "$GITHUB_ENV"
          GHCL="$(dirname "$RTS_FILE")"; GHPL="$(dirname "$INT_FILE")"
          echo "LD_LIBRARY_PATH=$GHCL:$GHPL${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: 五语言编译（源码 → .so，任一失败即红）
        run: |
          bash kernel/c-sample/build.sh
          bash kernel/go/build.sh
          bash kernel/rust/build.sh
          bash kernel/hs/build.sh
          bash kernel/cangjie/build.sh

      - name: 统一契约（41 断言 × 5 = 5/5，退出码=守门）
        run: bash kernel/run-contract.sh all
