# ubuntu · Firefox(Gecko) CI（R159.3 起）——第三引擎
#
# 与本地 firefox/run.sh 同一驱动（经典 WebDriver + geckodriver，FF BiDi 无
# script.* 的既有结论与版本无关）；真实时钟——无虚拟时间豁免页（imageext/
# measimage/builtindemo 在 Gecko 真实时钟全量跑，本地历史全绿）。
# 字体对齐（textmeasure 度量）与 browser 腿同款安装。
# geckodriver：runner 未预装时下载 mozilla 官方 v0.36.0（SHA 见 URL，Mozilla 官方 release）。

name: "ubuntu · Firefox(Gecko) · 全矩阵 87 用例"

on:
  push:
    branches: [main, ci]
  pull_request:
    types: [labeled]          # ci/full 标签审核制：维护者加标签触发 PR 全量
  workflow_dispatch: {}

# 治理（R159.3，参考 Reasonix 前置 CI 模型）：PR 只跑 pr-gate.yml（轻量前置：
#   body 三要素声明检查 + 快检）；本重矩阵仅在 push main/ci 与手动触发——
#   免审 PR 不烧重算力，审核后要全量可 workflow_dispatch --ref <PR 分支>。
permissions:
  contents: read

concurrency:
  group: ubuntu-firefox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox:
    if: github.event_name != 'pull_request' || github.event.label.name == 'ci/full'
    name: firefox (node ${{ matrix.node }})
    runs-on: ubuntu-24.04   # 钉 24.04（同家族理由）
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    env:
      NODE: node
      FF_FIREFOX: /usr/bin/firefox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: 系统依赖（Firefox 运行库 + 字体对齐 + geckodriver）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core libnss3 libgbm1
          test -x /usr/bin/firefox || { echo "❌ 未找到 /usr/bin/firefox（runner 应预装）"; exit 1; }
          firefox --version
          if ! command -v geckodriver >/dev/null 2>&1; then
            curl -sSL -o /tmp/geckodriver.tar.gz \
              https://github.com/mozilla/geckodriver/releases/download/v0.36.0/geckodriver-v0.36.0-linux64.tar.gz
            sudo tar -xzf /tmp/geckodriver.tar.gz -C /usr/local/bin
          fi
          geckodriver --version
      - name: firefox/run.sh all（87 用例 + 断言计数守门，overrides 分端差异）
        env:
          FF_FIREFOX: /usr/bin/firefox
          # FF_GECKODRIVER 不强制：交给 PATH 解析（十六跑实证——强制 /usr/local/bin
          # 会覆盖 runner 预装的 geckodriver 路径且下载步被跳过时 404）
        run: bash firefox/run.sh all
      - name: 失败留档（计数表 + 矩阵日志）
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: firefox-logs-node${{ matrix.node }}
          path: |
            build/assert-counts-firefox.tsv
            build/ff-matrix.log
            build/ff-geckodriver.log
          if-no-files-found: ignore
          retention-days: 7
